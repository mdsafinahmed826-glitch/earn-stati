<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafinBook - Social Media App by SAFIN</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        fbBlue: '#1877f2',
                        fbBg: '#f0f2f5',
                        fbDarkBg: '#18191a',
                        fbCardDark: '#242526',
                        fbHoverDark: '#3a3b3c'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- React & Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Firebase Compat SDKs (App, Auth, Realtime Database) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-fbBg dark:bg-fbDarkBg text-gray-900 dark:text-gray-100 font-sans transition-colors duration-200">
    <div id="root"></div>

    <script type="text/babel">
        // Firebase Config (Provided by user)
        const firebaseConfig = {
            apiKey: "AIzaSyDJwBkkuTwCpnEB6-JD4axqms5OniGr9-s",
            authDomain: "ern-93752.firebaseapp.com",
            databaseURL: "https://ern-93752-default-rtdb.firebaseio.com",
            projectId: "ern-93752",
            storageBucket: "ern-93752.firebasestorage.app",
            messagingSenderId: "159583001756",
            appId: "1:159583001756:web:c7c8380f88da94ba97e159",
            measurementId: "G-S8FXSQMLR3"
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();
        const auth = firebase.auth();

        // Initial Seed Data
        const initialUsersCount = 14528;
        const initialActiveCount = 184;

        const initialStories = [
            { id: 1, name: "Create story", image: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400", isCreate: true },
            { id: 2, name: "Tusar Suvro", image: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400", badge: "1" },
            { id: 3, name: "Abu Shovo", image: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=400", badge: "1" },
            { id: 4, name: "Md Safin", image: "https://images.unsplash.com/photo-1492562080023-ab3db95bfbce?w=400", badge: "1" },
            { id: 5, name: "Tanisha Islam", image: "https://images.unsplash.com/photo-1517841905240-472988babdf9?w=400", badge: "2" }
        ];

        const initialFriendRequests = [
            { id: 101, name: "Tanisha Islam", avatar: "https://images.unsplash.com/photo-1517841905240-472988babdf9?w=150", mutual: 2, time: "12h" },
            { id: 102, name: "Ariyan Rakid", avatar: "https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=150", mutual: 8, time: "6d" },
            { id: 103, name: "Md Abdul Khalak", avatar: "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=150", mutual: 16, time: "4w" },
            { id: 104, name: "Aizen Zarox", avatar: "https://images.unsplash.com/photo-1522075469751-3a6694fb2f61?w=150", mutual: 15, time: "3w" }
        ];

        function App() {
            const [user, setUser] = React.useState(null);
            const [activeTab, setActiveTab] = React.useState('feed'); // feed, friends, messenger, reels, notifications, menu
            const [darkMode, setDarkMode] = React.useState(false);
            const [posts, setPosts] = React.useState([]);
            const [friendRequests, setFriendRequests] = React.useState(initialFriendRequests);
            const [newPostText, setNewPostText] = React.useState('');
            const [selectedMedia, setSelectedMedia] = React.useState(null);
            const [feeling, setFeeling] = React.useState('');
            const [showCreatePostModal, setShowCreatePostModal] = React.useState(false);
            const [showAuthModal, setShowAuthModal] = React.useState(false);
            
            // Auth Form States
            const [authMode, setAuthMode] = React.useState('email'); // 'email' or 'phone'
            const [isSignUp, setIsSignUp] = React.useState(false);
            const [email, setEmail] = React.useState('');
            const [password, setPassword] = React.useState('');
            const [displayName, setDisplayName] = React.useState('');
            const [phoneNumber, setPhoneNumber] = React.useState('');
            const [verificationCode, setVerificationCode] = React.useState('');
            const [confirmationResult, setConfirmationResult] = React.useState(null);
            const [authError, setAuthError] = React.useState('');
            const [authMsg, setAuthMsg] = React.useState('');

            // Per post comment input states
            const [commentInputs, setCommentInputs] = React.useState({});

            // Reaction bar toggle per post
            const [activeReactionPicker, setActiveReactionPicker] = React.useState(null);

            const [messages, setMessages] = React.useState([
                { id: 1, sender: 'Tanisha Islam', text: 'Hi Safin! How are you?', time: '10:30 AM' },
                { id: 2, sender: 'SAFIN', text: 'Hey Tanisha! I am doing great, working on SafinBook app.', time: '10:32 AM' }
            ]);
            const [currentChatMessage, setCurrentChatMessage] = React.useState('');
            const [activeChatUser, setActiveChatUser] = React.useState('Tanisha Islam');

            const fileInputRef = React.useRef(null);

            // Listen to Auth State Changes
            React.useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged((currentUser) => {
                    setUser(currentUser);
                    if (!currentUser) {
                        setShowAuthModal(true);
                    } else {
                        setShowAuthModal(false);
                    }
                });
                return () => unsubscribe();
            }, []);

            // Firebase Realtime Listener for Posts & Messages
            React.useEffect(() => {
                const postsRef = db.ref('posts');
                postsRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        const loadedPosts = Object.keys(data).map(key => ({
                            id: key,
                            ...data[key]
                        })).reverse();
                        setPosts(loadedPosts);
                    } else {
                        setPosts([]);
                    }
                });

                const msgRef = db.ref('messages');
                msgRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        const loadedMsgs = Object.keys(data).map(key => data[key]);
                        setMessages(loadedMsgs);
                    }
                });

                return () => {
                    postsRef.off();
                    msgRef.off();
                };
            }, []);

            // Handle Email Sign In / Sign Up
            const handleEmailAuth = async (e) => {
                e.preventDefault();
                setAuthError('');
                setAuthMsg('');
                try {
                    if (isSignUp) {
                        const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                        await userCredential.user.updateProfile({
                            displayName: displayName || email.split('@')[0],
                            photoURL: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150"
                        });
                        setAuthMsg('Account created successfully!');
                    } else {
                        await auth.signInWithEmailAndPassword(email, password);
                        setAuthMsg('Signed in successfully!');
                    }
                    setShowAuthModal(false);
                } catch (err) {
                    setAuthError(err.message);
                }
            };

            // Setup Recaptcha for Phone Auth
            const setupRecaptcha = () => {
                if (!window.recaptchaVerifier) {
                    window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
                        'size': 'invisible',
                        'callback': () => {}
                    });
                }
            };

            // Handle Send Phone Verification Code
            const handleSendPhoneCode = async (e) => {
                e.preventDefault();
                setAuthError('');
                setAuthMsg('');
                try {
                    setupRecaptcha();
                    const appVerifier = window.recaptchaVerifier;
                    const confirmation = await auth.signInWithPhoneNumber(phoneNumber, appVerifier);
                    setConfirmationResult(confirmation);
                    setAuthMsg('Verification code sent to your phone number!');
                } catch (err) {
                    setAuthError(err.message || 'Error sending SMS code. Make sure format is +8801xxxxxxxxx');
                }
            };

            // Handle Verify OTP Code
            const handleVerifyPhoneCode = async (e) => {
                e.preventDefault();
                setAuthError('');
                try {
                    if (confirmationResult) {
                        await confirmationResult.confirm(verificationCode);
                        setAuthMsg('Phone number verified successfully!');
                        setShowAuthModal(false);
                    }
                } catch (err) {
                    setAuthError('Invalid OTP code. Please try again.');
                }
            };

            // Sign Out
            const handleSignOut = () => {
                auth.signOut();
                setShowAuthModal(true);
            };

            // Handle Local File Upload
            const handleFileSelect = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    const isVideo = file.type.startsWith('video');
                    reader.onloadend = () => {
                        setSelectedMedia({
                            url: reader.result,
                            type: isVideo ? 'video' : 'image',
                            fileName: file.name
                        });
                    };
                    reader.readAsDataURL(file);
                }
            };

            // Toggle Dark Mode
            const toggleDarkMode = () => {
                setDarkMode(!darkMode);
                document.documentElement.classList.toggle('dark');
            };

            // Create Post
            const handleCreatePost = () => {
                if (!newPostText.trim() && !selectedMedia) return;

                const authorName = user?.displayName || user?.email?.split('@')[0] || user?.phoneNumber || "Md Safin Ahmed";
                const authorImg = user?.photoURL || "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150";

                const newPost = {
                    author: authorName,
                    authorAvatar: authorImg,
                    feeling: feeling || null,
                    time: "Just now",
                    text: newPostText,
                    mediaUrl: selectedMedia ? selectedMedia.url : null,
                    mediaType: selectedMedia ? selectedMedia.type : null,
                    likes: 0,
                    userReactions: {},
                    commentsCount: 0,
                    shares: 0,
                    comments: []
                };

                db.ref('posts').push(newPost);

                setNewPostText('');
                setSelectedMedia(null);
                setFeeling('');
                setShowCreatePostModal(false);
            };

            // Reaction Handler (Like, Love, Haha, Wow, Sad, Angry)
            const handleReaction = (postId, reactionType = 'like') => {
                const postRef = db.ref(`posts/${postId}`);
                postRef.once('value', (snapshot) => {
                    const postData = snapshot.val();
                    if (!postData) return;

                    const userId = user?.uid || 'guest_user';
                    let currentReactions = postData.userReactions || {};
                    let currentLikes = postData.likes || 0;

                    if (currentReactions[userId] === reactionType) {
                        delete currentReactions[userId];
                        currentLikes = Math.max(0, currentLikes - 1);
                    } else {
                        if (!currentReactions[userId]) {
                            currentLikes += 1;
                        }
                        currentReactions[userId] = reactionType;
                    }

                    postRef.update({
                        likes: currentLikes,
                        userReactions: currentReactions
                    });
                });
                setActiveReactionPicker(null);
            };

            // Comment Add Handler
            const handleAddComment = (postId) => {
                const commentText = commentInputs[postId];
                if (!commentText || !commentText.trim()) return;

                const commenterName = user?.displayName || user?.email?.split('@')[0] || user?.phoneNumber || "User";
                
                const newComment = {
                    id: Date.now().toString(),
                    user: commenterName,
                    text: commentText.trim(),
                    time: "Just now"
                };

                const postRef = db.ref(`posts/${postId}`);
                postRef.once('value', (snapshot) => {
                    const postData = snapshot.val();
                    let existingComments = [];
                    if (postData && postData.comments) {
                        existingComments = Array.isArray(postData.comments) 
                            ? postData.comments 
                            : Object.values(postData.comments);
                    }

                    const updatedComments = [...existingComments, newComment];
                    postRef.update({
                        comments: updatedComments,
                        commentsCount: updatedComments.length
                    });
                });

                setCommentInputs({ ...commentInputs, [postId]: '' });
            };

            // Send Chat Message
            const handleSendMessage = () => {
                if (!currentChatMessage.trim()) return;
                const senderName = user?.displayName || user?.email?.split('@')[0] || 'SAFIN';
                const newMsg = {
                    id: Date.now(),
                    sender: senderName,
                    receiver: activeChatUser,
                    text: currentChatMessage,
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                };

                db.ref('messages').push(newMsg);
                setCurrentChatMessage('');
            };

            // Friend Request Action
            const handleFriendRequest = (id) => {
                setFriendRequests(friendRequests.filter(req => req.id !== id));
            };

            return (
                <div className="min-h-screen flex flex-col bg-fbBg dark:bg-fbDarkBg pb-16 md:pb-0">
                    <div id="recaptcha-container"></div>
                    
                    {/* TOP HEADER */}
                    <header className="sticky top-0 z-40 bg-white dark:bg-fbCardDark border-b border-gray-200 dark:border-gray-800 px-4 py-2 flex items-center justify-between shadow-sm">
                        <div className="flex items-center space-x-2">
                            <h1 className="text-fbBlue font-black text-2xl tracking-tighter cursor-pointer" onClick={() => setActiveTab('feed')}>
                                SafinBook
                            </h1>
                            <span className="bg-blue-100 dark:bg-blue-900 text-fbBlue dark:text-blue-200 text-xs font-bold px-2 py-0.5 rounded-full">
                                {user ? `Logged in: ${user.displayName || user.email || 'User'}` : 'Guest Mode'}
                            </span>
                        </div>

                        {/* Top Navigation Tabs for Desktop */}
                        <div className="hidden md:flex items-center space-x-1 lg:space-x-8">
                            <button onClick={() => setActiveTab('feed')} className={`p-3 rounded-lg text-xl ${activeTab === 'feed' ? 'text-fbBlue border-b-4 border-fbBlue' : 'text-gray-500 hover:bg-gray-100 dark:hover:bg-fbHoverDark'}`}>
                                <i className="fa-solid fa-house"></i>
                            </button>
                            <button onClick={() => setActiveTab('friends')} className={`p-3 rounded-lg text-xl relative ${activeTab === 'friends' ? 'text-fbBlue border-b-4 border-fbBlue' : 'text-gray-500 hover:bg-gray-100 dark:hover:bg-fbHoverDark'}`}>
                                <i className="fa-solid fa-user-group"></i>
                                {friendRequests.length > 0 && (
                                    <span className="absolute top-1 right-1 bg-red-500 text-white text-xs rounded-full px-1.5 py-0.2 font-bold">
                                        {friendRequests.length}
                                    </span>
                                )}
                            </button>
                            <button onClick={() => setActiveTab('messenger')} className={`p-3 rounded-lg text-xl ${activeTab === 'messenger' ? 'text-fbBlue border-b-4 border-fbBlue' : 'text-gray-500 hover:bg-gray-100 dark:hover:bg-fbHoverDark'}`}>
                                <i className="fa-brands fa-facebook-messenger"></i>
                            </button>
                            <button onClick={() => setActiveTab('reels')} className={`p-3 rounded-lg text-xl relative ${activeTab === 'reels' ? 'text-fbBlue border-b-4 border-fbBlue' : 'text-gray-500 hover:bg-gray-100 dark:hover:bg-fbHoverDark'}`}>
                                <i className="fa-solid fa-tv"></i>
                            </button>
                            <button onClick={() => setActiveTab('notifications')} className={`p-3 rounded-lg text-xl relative ${activeTab === 'notifications' ? 'text-fbBlue border-b-4 border-fbBlue' : 'text-gray-500 hover:bg-gray-100 dark:hover:bg-fbHoverDark'}`}>
                                <i className="fa-solid fa-bell"></i>
                            </button>
                            <button onClick={() => setActiveTab('menu')} className={`p-3 rounded-lg text-xl ${activeTab === 'menu' ? 'text-fbBlue border-b-4 border-fbBlue' : 'text-gray-500 hover:bg-gray-100 dark:hover:bg-fbHoverDark'}`}>
                                <i className="fa-solid fa-bars"></i>
                            </button>
                        </div>

                        {/* Top Right Actions */}
                        <div className="flex items-center space-x-2">
                            <button onClick={() => setShowCreatePostModal(true)} className="w-10 h-10 rounded-full bg-gray-200 dark:bg-fbHoverDark flex items-center justify-center hover:bg-gray-300 transition" title="Create Post">
                                <i className="fa-solid fa-plus text-lg"></i>
                            </button>
                            {user ? (
                                <button onClick={handleSignOut} className="bg-red-500 text-white text-xs font-bold px-3 py-2 rounded-lg hover:bg-red-600 transition">
                                    Log Out
                                </button>
                            ) : (
                                <button onClick={() => setShowAuthModal(true)} className="bg-fbBlue text-white text-xs font-bold px-3 py-2 rounded-lg hover:opacity-90 transition">
                                    Log In
                                </button>
                            )}
                        </div>
                    </header>

                    {/* MOBILE TOP TAB NAVIGATION BAR */}
                    <div className="md:hidden sticky top-[57px] z-30 bg-white dark:bg-fbCardDark border-b border-gray-200 dark:border-gray-800 flex justify-around py-1 shadow-sm">
                        <button onClick={() => setActiveTab('feed')} className={`p-2 relative ${activeTab === 'feed' ? 'text-fbBlue border-b-2 border-fbBlue' : 'text-gray-500'}`}>
                            <i className="fa-solid fa-house text-xl"></i>
                        </button>
                        <button onClick={() => setActiveTab('friends')} className={`p-2 relative ${activeTab === 'friends' ? 'text-fbBlue border-b-2 border-fbBlue' : 'text-gray-500'}`}>
                            <i className="fa-solid fa-user-group text-xl"></i>
                        </button>
                        <button onClick={() => setActiveTab('messenger')} className={`p-2 ${activeTab === 'messenger' ? 'text-fbBlue border-b-2 border-fbBlue' : 'text-gray-500'}`}>
                            <i className="fa-brands fa-facebook-messenger text-xl"></i>
                        </button>
                        <button onClick={() => setActiveTab('reels')} className={`p-2 relative ${activeTab === 'reels' ? 'text-fbBlue border-b-2 border-fbBlue' : 'text-gray-500'}`}>
                            <i className="fa-solid fa-tv text-xl"></i>
                        </button>
                        <button onClick={() => setActiveTab('menu')} className={`p-2 ${activeTab === 'menu' ? 'text-fbBlue border-b-2 border-fbBlue' : 'text-gray-500'}`}>
                            <i className="fa-solid fa-bars text-xl"></i>
                        </button>
                    </div>

                    {/* MAIN CONTENT AREA */}
                    {}
                    <main className="flex-1 max-w-4xl mx-auto w-full p-2 md:p-4">

                        {/* TAB 1: FEED */}
                        {activeTab === 'feed' && (
                            <div className="space-y-4">

                                {/* Banner */}
                                <div className="bg-gradient-to-r from-blue-600 to-indigo-600 text-white p-3 rounded-xl shadow flex justify-between items-center text-xs md:text-sm">
                                    <div className="flex items-center space-x-2">
                                        <span className="w-2.5 h-2.5 bg-green-400 rounded-full animate-ping"></span>
                                        <span className="font-semibold">{initialUsersCount.toLocaleString()} Total Community Members</span>
                                    </div>
                                    <div className="bg-white/20 px-2.5 py-1 rounded-full font-bold">
                                        🟢 {initialActiveCount} Active Now
                                    </div>
                                </div>

                                {/* Create Post Prompt Box */}
                                <div className="bg-white dark:bg-fbCardDark rounded-xl p-3 shadow border border-gray-200 dark:border-gray-800">
                                    <div className="flex items-center space-x-3 pb-3 border-b border-gray-200 dark:border-gray-700">
                                        <img src={user?.photoURL || "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150"} className="w-10 h-10 rounded-full object-cover" />
                                        <button 
                                            onClick={() => setShowCreatePostModal(true)}
                                            className="flex-1 bg-gray-100 dark:bg-fbHoverDark text-left px-4 py-2.5 rounded-full text-gray-500 dark:text-gray-400 text-sm hover:bg-gray-200 transition"
                                        >
                                            {user ? `What's on your mind, ${user.displayName || 'friend'}?` : "What's on your mind? (Login to post)"}
                                        </button>
                                        <button 
                                            onClick={() => { setShowCreatePostModal(true); setTimeout(() => fileInputRef.current?.click(), 100); }} 
                                            className="flex flex-col items-center text-green-500 hover:opacity-80 p-1"
                                        >
                                            <i className="fa-solid fa-images text-xl"></i>
                                            <span className="text-[10px] text-gray-600 dark:text-gray-300 font-medium">Photo</span>
                                        </button>
                                    </div>
                                </div>

                                {/* Stories */}
                                <div className="flex space-x-2 overflow-x-auto no-scrollbar py-1">
                                    {initialStories.map((story) => (
                                        <div key={story.id} className="relative min-w-[105px] h-[170px] rounded-xl overflow-hidden shadow-md group cursor-pointer flex-shrink-0 border border-gray-200 dark:border-gray-800 bg-gray-900">
                                            <img src={story.image} className="w-full h-full object-cover group-hover:scale-105 transition duration-300 opacity-90" />
                                            {story.isCreate ? (
                                                <div className="absolute inset-0 bg-black/30 flex flex-col justify-end items-center p-2 text-center" onClick={() => setShowCreatePostModal(true)}>
                                                    <div className="w-9 h-9 rounded-full bg-fbBlue text-white flex items-center justify-center border-2 border-white mb-1">
                                                        <i className="fa-solid fa-plus text-lg"></i>
                                                    </div>
                                                    <span className="text-xs font-bold text-white drop-shadow">Create story</span>
                                                </div>
                                            ) : (
                                                <>
                                                    <span className="absolute top-2 left-2 bg-fbBlue text-white text-[10px] px-1.5 py-0.5 rounded-md font-bold">
                                                        {story.badge}
                                                    </span>
                                                    <span className="absolute bottom-2 left-2 right-2 text-xs font-bold text-white drop-shadow truncate">
                                                        {story.name}
                                                    </span>
                                                </>
                                            )}
                                        </div>
                                    ))}
                                </div>

                                {/* Posts Feed */}
                                {posts.length === 0 ? (
                                    <div className="bg-white dark:bg-fbCardDark rounded-xl p-8 text-center text-gray-500">
                                        No posts available yet. Create the first post above!
                                    </div>
                                ) : (
                                    posts.map((post) => {
                                        const myReaction = user ? (post.userReactions && post.userReactions[user.uid]) : null;
                                        const commentsList = post.comments 
                                            ? (Array.isArray(post.comments) ? post.comments : Object.values(post.comments)) 
                                            : [];

                                        return (
                                            <div key={post.id} className="bg-white dark:bg-fbCardDark rounded-xl shadow border border-gray-200 dark:border-gray-800 p-3 md:p-4 space-y-3 relative">
                                                {/* Author Info */}
                                                <div className="flex justify-between items-center">
                                                    <div className="flex items-center space-x-3">
                                                        <img src={post.authorAvatar || "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150"} className="w-10 h-10 rounded-full object-cover border border-fbBlue" />
                                                        <div>
                                                            <div className="flex items-center space-x-1">
                                                                <h4 className="font-bold text-sm hover:underline cursor-pointer">{post.author}</h4>
                                                                {post.feeling && (
                                                                    <span className="text-xs text-gray-500 font-normal">
                                                                        is feeling <b>{post.feeling}</b>
                                                                    </span>
                                                                )}
                                                            </div>
                                                            <p className="text-xs text-gray-400 flex items-center space-x-1">
                                                                <span>{post.time || 'Recently'}</span>
                                                                <span>•</span>
                                                                <i className="fa-solid fa-earth-americas text-[10px]"></i>
                                                            </p>
                                                        </div>
                                                    </div>
                                                </div>

                                                {/* Text Content */}
                                                <p className="text-sm md:text-base leading-relaxed whitespace-pre-line">
                                                    {post.text}
                                                </p>

                                                {/* Media Attachment */}
                                                {post.mediaUrl && (
                                                    <div className="rounded-lg overflow-hidden max-h-[450px] bg-black border border-gray-100 dark:border-gray-800">
                                                        {post.mediaType === 'video' ? (
                                                            <video src={post.mediaUrl} controls className="w-full max-h-[450px] object-contain" />
                                                        ) : (
                                                            <img src={post.mediaUrl} className="w-full max-h-[450px] object-contain" />
                                                        )}
                                                    </div>
                                                )}

                                                {/* Reaction Counters */}
                                                <div className="flex justify-between items-center text-xs text-gray-500 dark:text-gray-400 pt-2 border-b border-gray-100 dark:border-gray-800 pb-2">
                                                    <div className="flex items-center space-x-1">
                                                        <span className="bg-fbBlue text-white p-1 rounded-full w-4 h-4 flex items-center justify-center text-[8px]">👍</span>
                                                        <span className="bg-red-500 text-white p-1 rounded-full w-4 h-4 flex items-center justify-center text-[8px]">❤️</span>
                                                        <span>{post.likes || 0}</span>
                                                    </div>
                                                    <div className="space-x-3">
                                                        <span>{commentsList.length} comments</span>
                                                    </div>
                                                </div>

                                                {/* Reaction Popover & Action Buttons */}
                                                <div className="relative grid grid-cols-3 gap-1 pt-1 text-xs md:text-sm font-semibold text-gray-600 dark:text-gray-300">
                                                    {activeReactionPicker === post.id && (
                                                        <div className="absolute -top-10 left-0 bg-white dark:bg-fbCardDark shadow-xl rounded-full px-3 py-1.5 border border-gray-200 dark:border-gray-700 flex space-x-3 z-30 animate-bounce">
                                                            <button onClick={() => handleReaction(post.id, 'like')} className="hover:scale-125 transition text-lg">👍</button>
                                                            <button onClick={() => handleReaction(post.id, 'love')} className="hover:scale-125 transition text-lg">❤️</button>
                                                            <button onClick={() => handleReaction(post.id, 'haha')} className="hover:scale-125 transition text-lg">😂</button>
                                                            <button onClick={() => handleReaction(post.id, 'wow')} className="hover:scale-125 transition text-lg">😮</button>
                                                            <button onClick={() => handleReaction(post.id, 'sad')} className="hover:scale-125 transition text-lg">😢</button>
                                                            <button onClick={() => handleReaction(post.id, 'angry')} className="hover:scale-125 transition text-lg">😡</button>
                                                        </div>
                                                    )}

                                                    <button 
                                                        onClick={() => handleReaction(post.id, myReaction ? myReaction : 'like')}
                                                        onMouseEnter={() => setActiveReactionPicker(post.id)}
                                                        className={`flex items-center justify-center space-x-2 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-fbHoverDark transition ${myReaction ? 'text-fbBlue font-bold' : ''}`}
                                                    >
                                                        <span>{myReaction === 'love' ? '❤️ Love' : myReaction === 'haha' ? '😂 Haha' : myReaction === 'sad' ? '😢 Sad' : myReaction === 'angry' ? '😡 Angry' : '👍 Like'}</span>
                                                    </button>
                                                    
                                                    <button className="flex items-center justify-center space-x-2 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-fbHoverDark transition">
                                                        <i className="fa-regular fa-message"></i>
                                                        <span>Comment</span>
                                                    </button>
                                                    <button className="flex items-center justify-center space-x-2 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-fbHoverDark transition">
                                                        <i className="fa-solid fa-share"></i>
                                                        <span>Share</span>
                                                    </button>
                                                </div>

                                                {/* Comments List */}
                                                {commentsList.length > 0 && (
                                                    <div className="space-y-2 pt-2 border-t border-gray-100 dark:border-gray-800">
                                                        {commentsList.map((c, idx) => (
                                                            <div key={idx} className="flex items-start space-x-2">
                                                                <div className="bg-gray-100 dark:bg-fbHoverDark p-2 rounded-2xl text-xs max-w-[85%]">
                                                                    <span className="font-bold block">{c.user}</span>
                                                                    <span>{c.text}</span>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}

                                                {/* Interactive Comment Input Box */}
                                                <div className="flex items-center space-x-2 pt-2">
                                                    <img src={user?.photoURL || "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150"} className="w-7 h-7 rounded-full object-cover" />
                                                    <input 
                                                        type="text" 
                                                        value={commentInputs[post.id] || ''}
                                                        onChange={(e) => setCommentInputs({ ...commentInputs, [post.id]: e.target.value })}
                                                        onKeyDown={(e) => e.key === 'Enter' && handleAddComment(post.id)}
                                                        placeholder="Write a comment..." 
                                                        className="flex-1 bg-gray-100 dark:bg-fbHoverDark text-xs px-3 py-2 rounded-full focus:outline-none"
                                                    />
                                                    <button 
                                                        onClick={() => handleAddComment(post.id)}
                                                        className="text-fbBlue hover:bg-blue-50 dark:hover:bg-fbHoverDark p-1.5 rounded-full"
                                                    >
                                                        <i className="fa-solid fa-paper-plane text-sm"></i>
                                                    </button>
                                                </div>

                                            </div>
                                        );
                                    })
                                )}
                            </div>
                        )}

                        {/* TAB 2: FRIENDS */}
                        {activeTab === 'friends' && (
                            <div className="bg-white dark:bg-fbCardDark rounded-xl p-4 shadow border border-gray-200 dark:border-gray-800 space-y-4">
                                <h2 className="text-xl font-bold">Friend Requests</h2>
                                {friendRequests.map(req => (
                                    <div key={req.id} className="flex items-center space-x-3 p-2 border-b border-gray-100 dark:border-gray-800">
                                        <img src={req.avatar} className="w-14 h-14 rounded-full object-cover" />
                                        <div className="flex-1">
                                            <h4 className="font-bold text-sm">{req.name}</h4>
                                            <p className="text-xs text-gray-500 mb-2">{req.mutual} mutual friends</p>
                                            <div className="flex space-x-2">
                                                <button onClick={() => handleFriendRequest(req.id)} className="bg-fbBlue text-white text-xs font-bold px-4 py-1.5 rounded-lg">Confirm</button>
                                                <button onClick={() => handleFriendRequest(req.id)} className="bg-gray-200 dark:bg-fbHoverDark text-xs font-bold px-4 py-1.5 rounded-lg">Delete</button>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {/* TAB 3: MESSENGER */}
                        {activeTab === 'messenger' && (
                            <div className="bg-white dark:bg-fbCardDark rounded-xl shadow border border-gray-200 dark:border-gray-800 h-[70vh] flex flex-col md:flex-row overflow-hidden">
                                <div className="w-full md:w-1/3 border-r border-gray-200 dark:border-gray-800 p-3 space-y-3">
                                    <h2 className="text-xl font-bold">Chats</h2>
                                    {['Tanisha Islam', 'Ariyan Rakid', 'Abu Shovo', 'Md Abdul Khalak'].map((u, idx) => (
                                        <div 
                                            key={idx}
                                            onClick={() => setActiveChatUser(u)}
                                            className={`flex items-center space-x-3 p-2 rounded-lg cursor-pointer ${activeChatUser === u ? 'bg-blue-50 dark:bg-fbHoverDark' : 'hover:bg-gray-100 dark:hover:bg-fbHoverDark'}`}
                                        >
                                            <img src={`https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100`} className="w-10 h-10 rounded-full object-cover" />
                                            <div>
                                                <h4 className="font-bold text-sm">{u}</h4>
                                                <p className="text-xs text-gray-500">Active now</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <div className="flex-1 flex flex-col justify-between bg-gray-50 dark:bg-fbDarkBg">
                                    <div className="p-3 bg-white dark:bg-fbCardDark border-b border-gray-200 dark:border-gray-800 font-bold">
                                        Chatting with {activeChatUser}
                                    </div>
                                    <div className="p-3 flex-1 overflow-y-auto space-y-2">
                                        {messages.map((m) => (
                                            <div key={m.id} className={`flex ${m.sender === (user?.displayName || 'SAFIN') ? 'justify-end' : 'justify-start'}`}>
                                                <div className={`p-2.5 rounded-2xl text-xs max-w-[70%] ${m.sender === (user?.displayName || 'SAFIN') ? 'bg-fbBlue text-white' : 'bg-white dark:bg-fbCardDark border'}`}>
                                                    <p>{m.text}</p>
                                                    <span className="text-[9px] opacity-70 block text-right mt-1">{m.time}</span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="p-2 bg-white dark:bg-fbCardDark border-t border-gray-200 dark:border-gray-800 flex items-center space-x-2">
                                        <input 
                                            type="text" 
                                            value={currentChatMessage}
                                            onChange={(e) => setCurrentChatMessage(e.target.value)}
                                            onKeyDown={(e) => e.key === 'Enter' && handleSendMessage()}
                                            placeholder="Write a message..."
                                            className="flex-1 bg-gray-100 dark:bg-fbHoverDark text-xs px-3 py-2 rounded-full focus:outline-none"
                                        />
                                        <button onClick={handleSendMessage} className="bg-fbBlue text-white p-2 rounded-full w-8 h-8 flex items-center justify-center">
                                            <i className="fa-solid fa-paper-plane text-xs"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 4: REELS */}
                        {activeTab === 'reels' && (
                            <div className="flex justify-center items-center py-4">
                                <div className="w-full max-w-sm h-[70vh] bg-black rounded-2xl relative overflow-hidden flex items-center justify-center shadow-2xl">
                                    <video src="https://assets.mixkit.co/videos/preview/mixkit-tree-branches-in-the-breeze-1188-large.mp4" autoPlay loop muted className="w-full h-full object-cover"></video>
                                    <div className="absolute bottom-4 left-4 text-white">
                                        <h4 className="font-bold text-sm">@safin_official</h4>
                                        <p className="text-xs">Enjoying the vibes! 🌿 #safinbook</p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 5: MENU */}
                        {activeTab === 'menu' && (
                            <div className="bg-white dark:bg-fbCardDark rounded-xl p-4 shadow border border-gray-200 dark:border-gray-800 space-y-4">
                                <div className="flex items-center space-x-3 pb-3 border-b border-gray-200 dark:border-gray-800">
                                    <img src={user?.photoURL || "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150"} className="w-14 h-14 rounded-full object-cover" />
                                    <div>
                                        <h3 className="font-bold text-base">{user?.displayName || user?.email || user?.phoneNumber || "Guest User"}</h3>
                                        <p className="text-xs text-gray-500">SafinBook Member</p>
                                    </div>
                                </div>

                                <div className="space-y-2">
                                    <div onClick={toggleDarkMode} className="flex justify-between items-center p-3 bg-gray-100 dark:bg-fbHoverDark rounded-xl cursor-pointer">
                                        <span className="text-xs font-bold">Dark Mode</span>
                                        <input type="checkbox" checked={darkMode} readOnly />
                                    </div>
                                    {user && (
                                        <button onClick={handleSignOut} className="w-full bg-red-500 text-white font-bold text-xs py-3 rounded-xl">
                                            Log Out
                                        </button>
                                    )}
                                </div>
                            </div>
                        )}

                    </main>

                    {}
                    {/* MODAL: AUTHENTICATION (LOGIN / SIGNUP / PHONE) */}
                    {showAuthModal && (
                        <div className="fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-3">
                            <div className="bg-white dark:bg-fbCardDark w-full max-w-md rounded-2xl shadow-2xl p-6 border border-gray-200 dark:border-gray-800 space-y-4">
                                <div className="flex justify-between items-center border-b pb-3 border-gray-200 dark:border-gray-700">
                                    <h3 className="text-xl font-extrabold text-fbBlue">SafinBook Auth</h3>
                                    <button onClick={() => setShowAuthModal(false)} className="text-gray-400 hover:text-gray-600">
                                        <i className="fa-solid fa-xmark text-xl"></i>
                                    </button>
                                </div>

                                {/* Auth Type Tabs */}
                                <div className="flex border-b border-gray-200 dark:border-gray-700">
                                    <button 
                                        onClick={() => setAuthMode('email')} 
                                        className={`flex-1 py-2 font-bold text-xs ${authMode === 'email' ? 'border-b-2 border-fbBlue text-fbBlue' : 'text-gray-400'}`}
                                    >
                                        Email & Password
                                    </button>
                                    <button 
                                        onClick={() => setAuthMode('phone')} 
                                        className={`flex-1 py-2 font-bold text-xs ${authMode === 'phone' ? 'border-b-2 border-fbBlue text-fbBlue' : 'text-gray-400'}`}
                                    >
                                        Phone Number
                                    </button>
                                </div>

                                {authError && <div className="p-2 bg-red-100 text-red-600 text-xs rounded">{authError}</div>}
                                {authMsg && <div className="p-2 bg-green-100 text-green-700 text-xs rounded">{authMsg}</div>}

                                {/* EMAIL AUTH FORM */}
                                {authMode === 'email' && (
                                    <form onSubmit={handleEmailAuth} className="space-y-3">
                                        {isSignUp && (
                                            <div>
                                                <label className="text-xs font-bold block mb-1">Full Name</label>
                                                <input 
                                                    type="text" 
                                                    required 
                                                    value={displayName}
                                                    onChange={(e) => setDisplayName(e.target.value)}
                                                    placeholder="Md. Safin"
                                                    className="w-full bg-gray-100 dark:bg-fbHoverDark text-xs p-2.5 rounded-lg border focus:outline-none"
                                                />
                                            </div>
                                        )}
                                        <div>
                                            <label className="text-xs font-bold block mb-1">Email Address</label>
                                            <input 
                                                type="email" 
                                                required 
                                                value={email}
                                                onChange={(e) => setEmail(e.target.value)}
                                                placeholder="example@gmail.com"
                                                className="w-full bg-gray-100 dark:bg-fbHoverDark text-xs p-2.5 rounded-lg border focus:outline-none"
                                            />
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold block mb-1">Password</label>
                                            <input 
                                                type="password" 
                                                required 
                                                value={password}
                                                onChange={(e) => setPassword(e.target.value)}
                                                placeholder="••••••••"
                                                className="w-full bg-gray-100 dark:bg-fbHoverDark text-xs p-2.5 rounded-lg border focus:outline-none"
                                            />
                                        </div>

                                        <button type="submit" className="w-full bg-fbBlue text-white font-bold py-2.5 rounded-lg text-xs hover:opacity-90">
                                            {isSignUp ? 'Create Account' : 'Log In'}
                                        </button>

                                        <div className="text-center pt-2">
                                            <button 
                                                type="button" 
                                                onClick={() => setIsSignUp(!isSignUp)}
                                                className="text-fbBlue text-xs font-semibold hover:underline"
                                            >
                                                {isSignUp ? 'Already have an account? Log In' : "Don't have an account? Sign Up"}
                                            </button>
                                        </div>
                                    </form>
                                )}

                                {/* PHONE AUTH FORM */}
                                {authMode === 'phone' && (
                                    <div className="space-y-3">
                                        {!confirmationResult ? (
                                            <form onSubmit={handleSendPhoneCode} className="space-y-3">
                                                <div>
                                                    <label className="text-xs font-bold block mb-1">Phone Number (with country code)</label>
                                                    <input 
                                                        type="tel" 
                                                        required 
                                                        value={phoneNumber}
                                                        onChange={(e) => setPhoneNumber(e.target.value)}
                                                        placeholder="+8801700000000"
                                                        className="w-full bg-gray-100 dark:bg-fbHoverDark text-xs p-2.5 rounded-lg border focus:outline-none"
                                                    />
                                                </div>
                                                <button type="submit" className="w-full bg-green-600 text-white font-bold py-2.5 rounded-lg text-xs hover:opacity-90">
                                                    Send OTP Code
                                                </button>
                                            </form>
                                        ) : (
                                            <form onSubmit={handleVerifyPhoneCode} className="space-y-3">
                                                <div>
                                                    <label className="text-xs font-bold block mb-1">Enter OTP Verification Code</label>
                                                    <input 
                                                        type="text" 
                                                        required 
                                                        value={verificationCode}
                                                        onChange={(e) => setVerificationCode(e.target.value)}
                                                        placeholder="123456"
                                                        className="w-full bg-gray-100 dark:bg-fbHoverDark text-xs p-2.5 rounded-lg border focus:outline-none text-center letter-spacing-2 font-bold"
                                                    />
                                                </div>
                                                <button type="submit" className="w-full bg-fbBlue text-white font-bold py-2.5 rounded-lg text-xs hover:opacity-90">
                                                    Verify & Sign In
                                                </button>
                                            </form>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* MODAL: CREATE POST */}
                    {showCreatePostModal && (
                        <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-3">
                            <div className="bg-white dark:bg-fbCardDark w-full max-w-lg rounded-xl shadow-2xl p-4 space-y-3 border border-gray-200 dark:border-gray-800">
                                <div className="flex justify-between items-center border-b pb-2">
                                    <h3 className="font-bold text-center flex-1">Create Post</h3>
                                    <button onClick={() => setShowCreatePostModal(false)}>
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>

                                <textarea 
                                    rows="3"
                                    value={newPostText}
                                    onChange={(e) => setNewPostText(e.target.value)}
                                    placeholder="What's on your mind?"
                                    className="w-full bg-transparent border-none text-sm focus:outline-none resize-none"
                                ></textarea>

                                {selectedMedia && (
                                    <div className="relative rounded-lg overflow-hidden border border-gray-200 bg-black">
                                        <button onClick={() => setSelectedMedia(null)} className="absolute top-2 right-2 bg-black/70 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs">
                                            <i className="fa-solid fa-xmark"></i>
                                        </button>
                                        <img src={selectedMedia.url} className="w-full h-40 object-contain" />
                                    </div>
                                )}

                                <input type="file" ref={fileInputRef} accept="image/*,video/*" onChange={handleFileSelect} className="hidden" />

                                <div className="border rounded-lg p-2 flex justify-between items-center">
                                    <span className="text-xs font-semibold">Add to your post</span>
                                    <button onClick={() => fileInputRef.current?.click()} className="text-green-500 text-lg">
                                        <i className="fa-solid fa-images"></i>
                                    </button>
                                </div>

                                <button onClick={handleCreatePost} className="w-full bg-fbBlue text-white font-bold py-2 rounded-lg text-xs">
                                    POST
                                </button>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
