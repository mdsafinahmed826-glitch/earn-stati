/* ---------- persistence ---------- */
var last={};
async function syncColl(name,items,idf,del){
  if(!fs)return;var L=last[name]||(last[name]={});var batch=db.batch();var n=0;var seen={};
  items.forEach(function(it){var id=idf(it);seen[id]=1;var s=stable(it);if(L[id]!==s){batch.set(db.collection(name).doc(id),clean(it));L[id]=s;n++}});
  if(del)Object.keys(L).forEach(function(id){if(!seen[id]){batch.delete(db.collection(name).doc(id));delete L[id];n++}});
  if(n){try{await batch.commit()}catch(e){console.warn('sync '+name,e)}}
}
function fsSave(k){
  if(!fs)return;
  if(k==='products'&&S.products)syncColl('products',S.products,function(p){return p.id},true);
  else if(k==='orders')syncColl('orders',S.orders,function(o){return o.id},false);
  else if(k==='users')syncColl('users',S.users||[],function(u){return u.id},false);
  else if(k==='reviews')syncColl('reviews',Object.keys(S.reviews).map(function(id){return{id:id,list:S.reviews[id]}}),function(x){return x.id},false);
  else if(k==='msgs')syncColl('messages',S.msgs,function(m){return m.id},true);
  else if(k==='coupons')syncColl('coupons',S.coupons,function(c){return c.code},true);
  else if(k==='settings')db.collection('settings').doc('main').set(clean(S.settings)).catch(function(e){console.warn(e)});
}
function save(k){
  if(k==='session')ls.set('session',S.session?S.session.id:'');
  else if(k==='coupon')ls.set('coupon',S.coupon||'');
  else ls.set(k,JSON.stringify(S[k]));
  fsSave(k);
}
function commit(){for(var i=0;i<arguments.length;i++)save(arguments[i]);emit()}
function emit(){if(raf)return;raf=requestAnimationFrame(function(){raf=0;renderAll(false)})}

/* ---------- cart / totals ---------- */
function calc(dist){
  var st=S.settings;var count=0;
  var sub=S.cart.reduce(function(a,l){var p=P(l.id);if(!p)return a;count+=l.qty;return a+p.price*l.qty},0);
  var d=0,err='',freeShip=false,c=null;
  if(S.coupon){
    c=activeCoupons().find(function(x){return x.code===S.coupon});
    if(!c)err='Invalid coupon';
    else if(c.min&&sub<c.min)err='Minimum order '+money(c.min)+' required';
    else if(c.type==='pct')d=Math.min(Math.round(sub*c.val/100),c.max||Infinity);
    else if(c.type==='flat')d=c.val;
    else if(c.type==='ship')freeShip=true;
  }
  if(err){d=0;freeShip=false}
  d=Math.min(d,sub);
  var fee=0;
  if(S.cart.length&&dist){fee=NEAR.indexOf(dist)>=0?st.nearFee:st.farFee;if(sub-d>=st.freeShip||freeShip)fee=0}
  return{sub:sub,disc:d,fee:fee,total:sub-d+fee,err:err,count:count}
}
function addCart(id,opt,qty){
  qty=qty||1;var p=P(id);
  if(!p||p.stock<=0){toast('Out of stock');return false}
  if(p.opts&&p.opts.length&&!opt){toast('Please select an option');return false}
  var have=S.cart.filter(function(x){return x.id===id}).reduce(function(a,x){return a+x.qty},0);
  if(have+qty>p.stock){toast('Only '+p.stock+' in stock');return false}
  var l=S.cart.find(function(x){return x.id===id&&(x.opt||null)===(opt||null)});
  if(l)l.qty+=qty;else S.cart.push({id:id,qty:qty,opt:opt||null});
  commit('cart');return true
}

/* ---------- auth ---------- */
async function sha(s){
  try{var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}
  catch(e){return btoa(unescape(encodeURIComponent(s)))}
}
function normL(s){s=String(s||'').trim().toLowerCase();if(/^[+\d][\d\s-]{9,}$/.test(s)){s=s.replace(/[\s-]/g,'').replace(/^\+?88(?=01)/,'')}return s}
async function findUser(login){
  if(!fs)return(S.users||[]).find(function(u){return u.login===login});
  var c=(S.users||[]).find(function(u){return u.login===login});if(c)return c;
  try{var s=await db.collection('users').where('login','==',login).limit(1).get();if(!s.empty){var u=s.docs[0].data();S.users=(S.users||[]).concat([u]);return u}}catch(e){console.warn(e)}
  return null
}
function ensureUser(u){S.users=S.users||[];var i=S.users.findIndex(function(x){return x.id===u.id});if(i<0)S.users.push(u);else S.users[i]=u}

/* ---------- orders ---------- */
async function placeOrder(){
  var u=S.session;if(!u){toast('Please login to checkout');go('/login?next=/checkout');return}
  var c=pg.co||{};var name=(c.name||'').trim(),phone=(c.phone||'').replace(/[\s-]/g,''),dist=c.district||'',addr=(c.address||'').trim();
  var mIdx=c.method||0;var method=METHODS[mIdx][0];
  if(!name){toast('Enter your full name');return}
  if(!isBD(phone)){toast('Enter a valid Bangladeshi mobile number');return}
  if(!dist){toast('Select your district');return}
  if(addr.length<5){toast('Enter your full address');return}
  var lines=S.cart.filter(function(l){return P(l.id)});
  if(!lines.length){toast('Your cart is empty');return}
  var t=calc(dist);if(t.err){toast(t.err);return}
  var trx='',sender='';
  if(mIdx>0){
    sender=(c.sender||'').replace(/[\s-]/g,'');trx=(c.trx||'').trim().toUpperCase();
    if(!isBD(sender)){toast('Enter your '+method+' number');return}
    if(trx.length<6){toast('Enter a valid transaction ID');return}
    var used=S.orders.some(function(o){return o.pay&&o.pay.trx&&o.pay.trx===trx});
    if(!used&&fs){try{var s=await db.collection('orders').where('pay.trx','==',trx).limit(1).get();used=!s.empty}catch(e){}}
    if(used){toast('This transaction ID was already used');return}
  }
  var tot={};lines.forEach(function(l){tot[l.id]=(tot[l.id]||0)+l.qty});
  for(var id in tot){var p=P(id);if(tot[id]>p.stock){toast(p.name+': only '+p.stock+' left');return}}
  var now=Date.now();
  var o={id:'SE'+now.toString(36).toUpperCase().slice(-6)+pad2(Math.floor(Math.random()*100)),uid:u.id,t:now,status:'Pending',hist:[{s:'Pending',t:now}],
    items:lines.map(function(l){var p=P(l.id);return{id:p.id,name:p.name,price:p.price,qty:l.qty,opt:l.opt||null,emoji:p.emoji,color:p.color}}),
    ship:{name:name,phone:phone,district:dist,address:addr,note:(c.note||'').trim()},
    pay:{method:method,trx:trx,sender:sender,status:mIdx?'Verification pending':'Unpaid (COD)'},
    sub:t.sub,disc:t.disc,coupon:S.coupon||'',ship_fee:t.fee,total:t.total};
  for(var id2 in tot){P(id2).stock-=tot[id2]}
  S.orders.unshift(o);
  u.name=name;u.phone=phone;u.district=dist;u.address=addr;ensureUser(u);
  S.cart=[];S.coupon='';pg.co=null;
  commit('products','orders','users','cart','coupon');
  go('/order/'+o.id+'?new=1')
}
function cancelOrder(id){
  var o=S.orders.find(function(x){return x.id===id});if(!o||!S.session||o.uid!==S.session.id)return;
  if(o.status!=='Pending'&&o.status!=='Confirmed')return;
  if(!confirm('Cancel this order?'))return;
  o.items.forEach(function(it){var p=P(it.id);if(p)p.stock+=it.qty});
  o.status='Cancelled';o.hist=(o.hist||[]).concat([{s:'Cancelled',t:Date.now()}]);
  commit('products','orders');toast('Order cancelled')

function listFilter(q){
  var a=S.products.slice();var cat=q.get('cat'),term=(q.get('q')||'').toLowerCase().trim();
  if(cat==='Offers'||q.get('offer'))a=a.filter(function(p){return disc(p)>=30});else if(cat)a=a.filter(function(p){return p.cat===cat});
  if(term){var tk=term.split(/\s+/);a=a.filter(function(p){var s=(p.name+' '+p.brand+' '+p.cat).toLowerCase();return tk.every(function(x){return s.indexOf(x)>=0})})}
  if(q.get('min'))a=a.filter(function(p){return p.price>=Number(q.get('min'))});
  if(q.get('max'))a=a.filter(function(p){return p.price<=Number(q.get('max'))});
  if(q.get('rating'))a=a.filter(function(p){return p.rating>=Number(q.get('rating'))});
  if(q.get('stock'))a=a.filter(function(p){return p.stock>0});
  var s=q.get('sort');
  if(s==='pa')a.sort(function(x,y){return x.price-y.price});else if(s==='pd')a.sort(function(x,y){return y.price-x.price});
  else if(s==='new')a.sort(function(x,y){return y.added-x.added});else if(s==='top')a.sort(function(x,y){return y.rating-x.rating});
  else if(s==='disc')a.sort(function(x,y){return disc(y)-disc(x)});
  return a
}

/* ---------- render ---------- */
function updateChrome(r){
  var c=S.cart.reduce(function(a,l){return a+(P(l.id)?l.qty:0)},0);
  ['#hb','#nb'].forEach(function(s){var b=$(s);b.textContent=c;b.style.display=c?'flex':'none';if(lastCount>=0&&c!==lastCount){b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop')}});
  lastCount=c;
  $('#bk').classList.toggle('hide',r.path==='/');
  var seg=r.seg[0]||'home';var map={home:'home',explore:'explore',list:'explore',cart:'cart',checkout:'cart',account:'account',login:'account',orders:'account',order:'account',wishlist:'account',admin:'account'};
  document.querySelectorAll('#bnav a').forEach(function(a){a.classList.toggle('on',a.dataset.n===(map[seg]||''))});
  var qi=$('#q');if(document.activeElement!==qi)qi.value=seg==='list'?(r.q.get('q')||''):'';
  var f=$('#ftr');
  if(ui.ready){f.style.display='block';f.innerHTML='<b style="font-size:16px">\ud83d\udecd\ufe0f '+BRAND+'</b><p class="muted" style="margin-top:4px">Quality products, honest prices and fast delivery across Bangladesh.</p><div class="cols"><div><h4>Shop</h4><a href="#/">Home</a><a href="#/explore">All categories</a><a href="#/list?cat=Offers">Offers</a></div><div><h4>Support</h4><a href="#/orders">Track order</a><a href="#" data-act="help" onclick="return false">Help &amp; contact</a><a href="tel:'+esc(S.settings.phone)+'">'+esc(S.settings.phone)+'</a></div></div><div class="pm"><span>Cash on Delivery</span><span>bKash</span><span>Nagad</span><span>Rocket</span></div><div class="muted" style="font-size:12px">\u00a9 '+new Date().getFullYear()+' '+BRAND+'. All rights reserved.</div>'}
  else f.style.display='none'
}
function renderAll(nav){
  var r=parse();updateChrome(r);
  var ae=document.activeElement;
  if(!nav&&ae&&app.contains(ae)&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))return;
  var y=window.scrollY;
  timers.forEach(clearInterval);timers=[];post=[];
  if(nav){pg={jfy:8,lp:8,opt:null,qty:1,co:null};window.scrollTo(0,0);closeSugg();closeSheet()}
  var html;
  if(!ui.ready)html=skeleton();
  else{
    var key=r.seg[0]||'home';
    if(!pages[key])html=empty('fa-compass','Page not found','Go Home','/');
    else{try{html=pages[key](r)}catch(e){console.error(e);html=empty('fa-exclamation-triangle','Something went wrong','Go Home','/')}}
  }
  app.innerHTML='<div class="'+(nav?'page-enter':'')+'">'+html+'</div>';
  if(!nav)window.scrollTo(0,y);
  app.querySelectorAll('img.im').forEach(function(i){if(i.complete&&i.naturalWidth)i.classList.add('ld')});
  scan();
  var ps=post;post=[];ps.forEach(function(f){try{f()}catch(e){console.error(e)}})
}
var io=('IntersectionObserver' in window&&!reduceMotion)?new IntersectionObserver(function(es){var n=0;es.forEach(function(en){if(en.isIntersecting){en.target.style.transitionDelay=Math.min(n++,8)*0.05+'s';en.target.classList.add('in');io.unobserve(en.target)}})},{threshold:.05}):null;
function scan(){app.querySelectorAll('.rv:not(.in)').forEach(function(el){if(io)io.observe(el);else el.classList.add('in')})}
new MutationObserver(scan).observe(app,{childList:true,subtree:true});

/* ---------- global events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');
  if(!t){if(!e.target.closest('.top-header'))closeSugg();return}
  var f=A[t.dataset.act];if(!f)return;
  if(t.dataset.act!=='ovl')e.stopPropagation();
  if(t.classList.contains('btn')){
    if(t.classList.contains('loading'))return;
    t.classList.add('loading');
    setTimeout(function(){t.classList.remove('loading');f(t,e)},350)
  }else f(t,e)
});
document.addEventListener('change',function(e){var t=e.target;if(t.dataset&&t.dataset.chg&&CH[t.dataset.chg]){if(t.tagName==='SELECT')t.blur();CH[t.dataset.chg](t)}});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.f&&pg.co)pg.co[t.dataset.f]=t.value;
  if(t.id==='q')showSugg()
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;var t=e.target;
  if(t.id==='q'){doSearch(t.value);return}
  var c=t.closest&&t.closest('[data-enter]');
  if(c&&t.tagName!=='TEXTAREA'){var b=c.querySelector('[data-act="'+c.dataset.enter+'"]');if(b){e.preventDefault();b.click()}}
});
$('#q').addEventListener('focus',showSugg);
document.addEventListener('error',function(e){var t=e.target;if(t&&t.tagName==='IMG'&&t.dataset.fb&&t.src!==t.dataset.fb){t.src=t.dataset.fb}},true);
document.addEventListener('load',function(e){var t=e.target;if(t&&t.tagName==='IMG')t.classList.add('ld')},true);
document.addEventListener('pointerdown',function(e){
  if(reduceMotion)return;var t=e.target.closest('.btn,.chip,.opt,.mi');if(!t||t.disabled)return;
  var r=t.getBoundingClientRect(),s=Math.max(r.width,r.height);var sp=document.createElement('span');sp.className='rpl';
  sp.style.cssText='width:'+s+'px;height:'+s+'px;left:'+(e.clientX-r.left-s/2)+'px;top:'+(e.clientY-r.top-s/2)+'px';
  t.appendChild(sp);setTimeout(function(){sp.remove()},600)
});
window.addEventListener('hashchange',function(){renderAll(true)});

/* ---------- Firestore listeners ---------- */
var unsubAdmin=[];
function stopAdmin(){unsubAdmin.forEach(function(f){try{f()}catch(e){}});unsubAdmin=[]}
function adminListen(){
  var LU=last.users||(last.users={}),LM=last.messages||(last.messages={});
  unsubAdmin.push(db.collection('users').onSnapshot(function(s){S.users=s.docs.map(function(d){var x=d.data();LU[x.id]=stable(x);return x});emit()},function(e){console.warn('users',e)}));
  unsubAdmin.push(db.collection('messages').onSnapshot(function(s){S.msgs=s.docs.map(function(d){var x=d.data();LM[x.id]=stable(x);return x});emit()},function(e){console.warn('messages',e)}))
}
function listenOrders(){stopAdmin();
  if(unsubOrders){unsubOrders();unsubOrders=null}
  if(!fs||!S.session)return;
  var L=last.orders||(last.orders={});if(isAdmin())adminListen();
  unsubOrders=(isAdmin()?db.collection('orders'):db.collection('orders').where('uid','==',S.session.id)).onSnapshot(function(s){
    S.orders=s.docs.map(function(d){var x=d.data();L[x.id]=stable(x);return x});emit()
  },function(e){console.warn('orders',e)})
}
function listeners(){
  db.collection('products').onSnapshot(function(s){
    var L=last.products||(last.products={});
    var arr=s.docs.map(function(d){var x=d.data();L[x.id]=stable(x);return x});
    if(arr.length){S.products=arr.sort(function(a,b){return(b.added||0)-(a.added||0)});emit()}
  },function(e){console.warn('products',e)});
  db.collection('reviews').onSnapshot(function(s){
    var L=last.reviews||(last.reviews={});var o={};
    s.docs.forEach(function(d){var x=d.data();L[x.id]=stable(x);o[x.id]=x.list||[]});S.reviews=o;emit()
  },function(e){console.warn('reviews',e)});
  db.collection('settings').doc('main').onSnapshot(function(d){if(d.exists){S.settings=Object.assign({},S.settings,d.data());emit()}},function(e){console.warn('settings',e)});
  db.collection('coupons').onSnapshot(function(s){
    var a=s.docs.map(function(d){return d.data()}).filter(function(c){return c&&c.code});
    var CL=last.coupons||(last.coupons={});a.forEach(function(c){CL[c.code]=stable(c)});S.coupons=a.length?a:DEFC.slice();emit()
  },function(e){console.warn('coupons',e)});
  listenOrders()
}

/* ---------- boot ---------- */
function withTimeout(p,ms){return Promise.race([p,new Promise(function(_,rej){setTimeout(function(){rej(new Error('timeout'))},ms)})])}
function loadPersonal(){
  S.cart=jget('cart',[]);S.wish=jget('wish',[]);S.recent=jget('recent',[]);S.searches=jget('searches',[]);S.coupon=ls.get('coupon')||''
}
function loadLocalData(){
  var p=jget('products',null);if(!p||!p.length){p=seedProducts();ls.set('products',JSON.stringify(p))}
  S.products=p;S.users=jget('users',[]);S.orders=jget('orders',[]);S.reviews=jget('reviews',{});S.msgs=jget('msgs',[]);
  S.settings=Object.assign({},S.settings,jget('settings',{}));
  var cp=jget('coupons',null);if(cp&&cp.length)S.coupons=cp;
  if(!ls.get('settings'))ls.set('settings',JSON.stringify(S.settings))
}
async function boot(){
  loadPersonal();renderAll(true);
  var ok=false;
  if(CFG&&JSON.stringify(CFG).indexOf('YOUR_')<0&&window.firebase){
    try{
      firebase.initializeApp(CFG);db=firebase.firestore();
      try{db.settings({experimentalAutoDetectLongPolling:true,merge:true})}catch(e){}
      var snap=await withTimeout(db.collection('products').get(),12000);
      var L=last.products={};
      if(snap.empty){
        var seed=seedProducts();var b=db.batch();
        seed.forEach(function(p){b.set(db.collection('products').doc(p.id),clean(p));L[p.id]=stable(p)});
        b.set(db.collection('settings').doc('main'),clean(S.settings));
        await withTimeout(b.commit(),12000);S.products=seed
      }else{
        S.products=snap.docs.map(function(d){var x=d.data();L[x.id]=stable(x);return x}).sort(function(a,b){return(b.added||0)-(a.added||0)})
      }
      fs=true;ok=true;S.users=[]
    }catch(e){console.warn('Firestore unavailable',e);fs=false;db=null}
  }
  if(!ok){loadLocalData();setTimeout(function(){toast('Offline mode: database not reachable')},400)}
  var sid=ls.get('session');
  if(sid){
    try{
      if(fs){var d=await withTimeout(db.collection('users').doc(sid).get(),8000);if(d.exists){S.session=d.data();S.users=[S.session]}}
      else S.session=(S.users||[]).find(function(u){return u.id===sid})||null
    }catch(e){console.warn(e)}
  }
  ui.ready=true;
  if(fs)listeners();
  renderAll(true)
}
boot()
})();
