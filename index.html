<head>

<body

    <!-- =========================================================
         FIREBASE
    ========================================================== -->

    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

        import {
            getAuth,
            RecaptchaVerifier,
            signInWithPhoneNumber,
            GoogleAuthProvider,
            signInWithRedirect,
            signOut,
            onAuthStateChanged,
            setPersistence,
            browserLocalPersistence,
            getRedirectResult
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        import {
            getDatabase,
            ref,
            set,
            push,
            onValue,
            get,
            update,
            remove
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";


        /* =====================================================
           FIREBASE CONFIG
        ====================================================== */

        const firebaseConfig = {
            apiKey: "AIzaSyDJwBkkuTwCpnEB6-JD4axqms5OniGr9-s",
            authDomain: "ern-93752.firebaseapp.com",
            databaseURL: "https://ern-93752-default-rtdb.firebaseio.com",
            projectId: "ern-93752",
            storageBucket: "ern-93752.firebasestorage.app",
            messagingSenderId: "159583001756",
            appId: "1:159583001756:web:c7c8380f88da94ba97e159",
            measurementId: "G-S8FXSQMLR3"
        };


        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);

        const db = getDatabase(app);


        /* =====================================================
           IMPORTANT AUTH STATE
        ====================================================== */

        let currentUser = null;
        let currentUserData = null;
        let activeChatUser = null;

        let confirmationResult = null;

        let initializedUid = null;

        let authReady = false;

        let profileLoading = false;

        let recentChatsStarted = false;

        let incomingCallsStarted = false;

        let activeMessagesListener = null;


        /*
         * Firebase LOCAL persistence.
         *
         * This MUST finish before we decide whether the
         * user is logged in or not.
         */

        const authPersistenceReady =
            setPersistence(auth, browserLocalPersistence);


        /* =====================================================
           DOM
        ====================================================== */

        const authScreen =
            document.getElementById("authScreen");

        const phoneTabBtn =
            document.getElementById("phoneTabBtn");

        const googleTabBtn =
            document.getElementById("googleTabBtn");

        const phoneAuthForm =
            document.getElementById("phoneAuthForm");

        const googleAuthForm =
            document.getElementById("googleAuthForm");

        const phoneInputGroup =
            document.getElementById("phoneInputGroup");

        const otpInputGroup =
            document.getElementById("otpInputGroup");

        const phoneNumberInput =
            document.getElementById("phoneNumberInput");

        const sendOtpBtn =
            document.getElementById("sendOtpBtn");

        const otpCodeInput =
            document.getElementById("otpCodeInput");

        const verifyOtpBtn =
            document.getElementById("verifyOtpBtn");

        const googleSignInBtn =
            document.getElementById("googleSignInBtn");


        /* =====================================================
           AUTH UI
        ====================================================== */

        function showLoginScreen() {

            authScreen.classList.remove("hidden");

        }


        function hideLoginScreen() {

            authScreen.classList.add("hidden");

        }


        /* =====================================================
           TABS
        ====================================================== */

        phoneTabBtn.addEventListener("click", () => {

            phoneTabBtn.className =
                "flex-1 py-2 text-wa-green font-semibold border-b-2 border-wa-green transition";

            googleTabBtn.className =
                "flex-1 py-2 text-wa-muted hover:text-white font-semibold transition";

            phoneAuthForm.classList.remove("hidden");

            googleAuthForm.classList.add("hidden");

        });


        googleTabBtn.addEventListener("click", () => {

            googleTabBtn.className =
                "flex-1 py-2 text-wa-green font-semibold border-b-2 border-wa-green transition";

            phoneTabBtn.className =
                "flex-1 py-2 text-wa-muted hover:text-white font-semibold transition";

            googleAuthForm.classList.remove("hidden");

            phoneAuthForm.classList.add("hidden");

        });


        /* =====================================================
           RECAPTCHA
        ====================================================== */

        function setupRecaptcha() {

            if (window.recaptchaVerifier) {
                return window.recaptchaVerifier;
            }

            window.recaptchaVerifier =
                new RecaptchaVerifier(
                    auth,
                    "recaptcha-container",
                    {
                        size: "normal",
                        callback: () => {
                            console.log("reCAPTCHA solved");
                        }
                    }
                );

            return window.recaptchaVerifier;
        }


        /* =====================================================
           PHONE LOGIN
        ====================================================== */

        sendOtpBtn.addEventListener("click", async () => {

            const phone =
                phoneNumberInput.value.trim();

            if (!phone || phone.length < 10) {

                alert(
                    "দয়া করে সঠিক ফোন নম্বর দিন।"
                );

                return;
            }

            try {

                await authPersistenceReady;

                const verifier =
                    setupRecaptcha();

                sendOtpBtn.disabled = true;

                sendOtpBtn.innerText =
                    "OTP পাঠানো হচ্ছে...";

                confirmationResult =
                    await signInWithPhoneNumber(
                        auth,
                        phone,
                        verifier
                    );

                phoneInputGroup.classList.add("hidden");

                otpInputGroup.classList.remove("hidden");

                sendOtpBtn.disabled = false;

        /* =====================================================
           CHAT ROOM
        ====================================================== */

        function getChatRoomId(uid1, uid2) {

            return uid1 < uid2
                ? `${uid1}_${uid2}`
                : `${uid2}_${uid1}`;

        }


        /* =====================================================
           MESSAGES
        ====================================================== */

        function loadMessages() {

            if (
                !currentUser ||
                !activeChatUser
            ) return;

            const roomId =
                getChatRoomId(
                    currentUser.uid,
                    activeChatUser.uid
                );

            const messagesRef =
                ref(
                    db,
                    "messages/" +
                    roomId
                );

            if (activeMessagesListener) {

                activeMessagesListener();

                activeMessagesListener =
                    null;

            }

            activeMessagesListener =
                onValue(
                    messagesRef,
                    snapshot => {

                        const container =
                            document.getElementById(
                                "messagesContainer"
                            );

                        container.innerHTML = "";

                        if (!snapshot.exists())
                            return;

                        const data =
                            snapshot.val();

                        Object.keys(data)
                            .forEach(key => {

                                const msg =
                                    data[key];

                                const isMe =
                                    msg.senderId ===
                                    currentUser.uid;

                                container.appendChild(
                                    createMessageElement(
                                        msg,
                                        isMe
                                    )
                                );

                            });

                        container.scrollTop =
                            container.scrollHeight;

                    }
                );

        }


        /* =====================================================
           MESSAGE ELEMENT
        ====================================================== */

        function createMessageElement(
            msg,
            isMe
        ) {

            const wrap =
                document.createElement(
                    "div"
                );

            wrap.className =
                `flex ${
                    isMe
                        ? "justify-end"
                        : "justify-start"
                } mb-2`;

            const bubble =
                document.createElement(
                    "div"
                );

            bubble.className =
                `max-w-[75%] rounded-2xl px-4 py-2 shadow-sm text-sm ${
                    isMe
                        ? "bg-wa-bubbleOut text-white rounded-tr-none"
                        : "bg-wa-bubbleIn text-white rounded-tl-none"
                }`;

            let content = "";

            if (msg.type === "text") {

                content =
                    `<p class="break-words leading-relaxed">
                        ${escapeHtml(msg.content)}
                    </p>`;

            }

            else if (msg.type === "image") {

                content =
                    `<img
                        src="${msg.content}"
                        class="max-w-xs max-h-60 rounded-lg object-cover cursor-pointer"
                    >`;

            }

            else if (msg.type === "video") {

                content =
                    `<video
                        src="${msg.content}"
                        controls
                        class="max-w-xs rounded-lg">
                    </video>`;

            }

            else if (msg.type === "audio") {

                content =
                    `<audio
                        src="${msg.content}"
                        controls
                        class="max-w-[220px]">
                    </audio>`;

            }

            const time =
                new Date(
                    msg.timestamp
                ).toLocaleTimeString(
                    [],
                    {
                        hour: "2-digit",
                        minute: "2-digit"
                    }
                );

            bubble.innerHTML = `

                ${content}

                <div class="text-[10px] text-wa-muted text-right mt-1">

                    ${time}

                    ${
                        isMe
                            ? '<i class="fa-solid fa-check-double text-blue-400 ml-1"></i>'
                            : ""
                    }

                </div>

            `;

            wrap.appendChild(
                bubble
            );

            return wrap;

        }


        /* =====================================================
           SEND MESSAGE
        ====================================================== */

        async function sendMessage(
            content,
            type = "text"
        ) {

            if (
                !currentUser ||
                !activeChatUser
            ) return;

            const roomId =
                getChatRoomId(
                    currentUser.uid,
                    activeChatUser.uid
                );

            const message = {

                senderId:
                    currentUser.uid,

                receiverId:
                    activeChatUser.uid,

                content,

                type,

                timestamp:
                    Date.now()

            };

            await push(
                ref(
                    db,
                    "messages/" +
                    roomId
                ),
                message
            );

            const summary =
                type === "text"
                    ? content
                    : `[${type}] বার্তা`;

            const time =
                Date.now();

            await set(
                ref(
                    db,
                    `user_chats/${currentUser.uid}/${activeChatUser.uid}`
                ),
                {
                    lastMessage:
                        summary,
                    timestamp:
                        time
                }
            );

            await set(
                ref(
                    db,
                    `user_chats/${activeChatUser.uid}/${currentUser.uid}`
                ),
                {
                    lastMessage:
                        summary,
                    timestamp:
                        time
                }
            );

        }

        let localStream = null;

        const rtcConfig = {

            iceServers: [

        function listenForIncomingCalls() {

            if (incomingCallsStarted)
                return;

            incomingCallsStarted =
                true;

            const callRef =
                ref(
                    db,
                    "calls/" +
                    currentUser.uid
                );

            onValue(
                callRef,
                snapshot => {

                    const data =
                        snapshot.val();

                    if (
                        !data ||
                        data.status !==
                        "calling"
                    ) return;

                    callOverlay.classList.remove(
                        "hidden"
                    );

                    document.getElementById(
                        "callUserName"
                    ).innerText =
                        data.callerName ||
                        "Unknown";

                    document.getElementById(
                        "callUserAvatar"
                    ).src =
                        data.callerPhoto ||
                        "https://placehold.co/100";

                    document.getElementById(
                        "callStatusText"
                    ).innerText =
                        `ইনকামিং ${
                            data.type === "video"
                                ? "ভিডিও"
                                : "অডিও"
                        } কল...`;

                    document.getElementById(
                        "incomingCallControls"
                    ).classList.remove(
                        "hidden"
                    );

                    document.getElementById(
                        "ongoingCallControls"
                    ).classList.add(
                        "hidden"
                    );

                    if (
                        data.type ===
                        "video"
                    ) {

                        videoContainer.classList.remove(
                            "hidden"
                        );

                    } else {

                        videoContainer.classList.add(
                            "hidden"
                        );

                    }

                    document.getElementById(
                        "acceptCallBtn"
                    ).onclick =
                        () => acceptIncomingCall(
                            data
                        );

                    document.getElementById(
                        "rejectCallBtn"
                    ).onclick =
                        async () => {

                            await remove(
                                callRef
                            );

                            closeCallUI();

                        };

                }
            );

        async function acceptIncomingCall(
            callData
        ) {

            try {

                document.getElementById(
                    "incomingCallControls"
                ).classList.add(
                    "hidden"
                );

                document.getElementById(
                    "ongoingCallControls"
                ).classList.remove(
                    "hidden"
                );

                document.getElementById(
                    "callStatusText"
                ).innerText =
                    "সংযুক্ত হচ্ছে...";

                localStream =
                    await navigator.mediaDevices
                        .getUserMedia({
                            audio: true,
                            video:
                                callData.type ===
                                "video"
                        });

                peerConnection =
                    new RTCPeerConnection(
                        rtcConfig
                    );

                localStream
                    .getTracks()
                    .forEach(
                        track => {
                            peerConnection.addTrack(
                                track,
                                localStream
                            );
                        }
                    );

                if (
                    callData.type ===
                    "video"
                ) {

                    document.getElementById(
                        "localVideo"
                    ).srcObject =
                        localStream;

                }

                peerConnection.ontrack =
                    event => {

                        if (
                            callData.type ===
                            "video"
                        ) {

                            document.getElementById(
                                "remoteVideo"
                            ).srcObject =
                                event.streams[0];

                        } else {

                            document.getElementById(
                                "remoteAudio"
                            ).srcObject =
                                event.streams[0];

                        }

                    };

                await peerConnection
                    .setRemoteDescription(
                        new RTCSessionDescription(
                            callData.offer
                        )
                    );

                const answer =
                    await peerConnection
                        .createAnswer();

                await peerConnection
                    .setLocalDescription(
                        answer
                    );

                await update(
                    ref(
                        db,
                        "calls/" +
                        currentUser.uid
                    ),
                    {
                        answer: {
                            sdp:
                                answer.sdp,
                            type:
                                answer.type
                        },
                        status:
                            "connected"
                    }
                );

                document.getElementById(
                    "callStatusText"
                ).innerText =
                    "সংযুক্ত হয়েছে";

            } catch (error) {

                console.error(error);

                alert(
                    "কল ধরতে সমস্যা হয়েছে: " +
                    error.message
                );

                closeCallUI();

            }

        }


        /* =====================================================
           CLOSE CALL
        ====================================================== */

        function closeCallUI() {

            if (localStream) {

                localStream
                    .getTracks()
                    .forEach(
                        track =>
                            track.stop()
                    );

                localStream = null;

            }

            if (peerConnection) {

                peerConnection.close();

                peerConnection = null;

            }

            callOverlay.classList.add(
                "hidden"
            );

        }


        /* =====================================================
           AUTH STARTUP
           THIS IS THE MOST IMPORTANT PART
        ====================================================== */

        async function startAuth() {

            try {

                /*
                 * First wait for Firebase persistence.
                 */

                await authPersistenceReady;


                /*
                 * Handle pending Google redirect.
                 *
                 * We DON'T use the returned result to initialize
                 * the app. onAuthStateChanged() does that.
                 */

                try {

                    await getRedirectResult(
                        auth
                    );

                } catch (error) {

                    console.error(
                        "Redirect result:",
                        error
                    );

                }


                /*
                 * ONE AND ONLY AUTH LISTENER
                 */

                onAuthStateChanged(
                    auth,
                    async user => {

                        console.log(
                            "AUTH STATE:",
                            user
                                ? user.uid
                                : "LOGGED OUT"
                        );


                        if (!user) {

                            /*
                             * Only a REAL null auth state
                             * can show the login page.
                             */

                            currentUser =
                                null;

                            currentUserData =
                                null;

                            initializedUid =
                                null;

                            recentChatsStarted =
                                false;

                            incomingCallsStarted =
                                false;

                            authReady =
                                true;

                            showLoginScreen();

                            return;

                        }


                        /*
                         * User is authenticated.
                         */

                        currentUser =
                            user;

                        authReady =
                            true;

                        hideLoginScreen();


                        /*
                         * Prevent duplicate initialization.
                         */

                        if (
                            initializedUid ===
                            user.uid
                        ) {

                            return;

                        }

                        initializedUid =
                            user.uid;


                        try {

                            await checkAndSetupUserProfile(
                                user
                            );

                            /*
                             * VERY IMPORTANT:
                             *
                             * কোনো profile/database error হলে
                             * এখানে login screen দেখানো যাবে না।
                             *
                             * কারণ Firebase user তখনও authenticated।
                             */

                            hideLoginScreen();

                        } catch (error) {

                            console.error(
                                "Profile initialization error:",
                                error
                            );

                            /*
                             * Main app remains visible.
                             */

                            hideLoginScreen();

                            alert(
                                "লগইন সফল হয়েছে, কিন্তু প্রোফাইল লোড করতে সমস্যা হয়েছে:\n" +
                                error.message
                            );

                        }

                    }
                );

            } catch (error) {

                console.error(
                    "Auth startup error:",
                    error
                );


                /*
                 * IMPORTANT:
                 *
                 * Firebase authenticated user থাকলে
                 * কখনো login screen দেখাবো না।
                 */

                if (auth.currentUser) {

                    currentUser =
                        auth.currentUser;

                    hideLoginScreen();

                } else {

                    showLoginScreen();

                    alert(
                        "Firebase চালু করা যায়নি:\n" +
                        error.message
                    );

                }

            }

        }


        /* =====================================================
           STARTUP
        ====================================================== */

        /*
         * Page load হওয়ার সময় login screen-কে
         * সরাসরি show করা হচ্ছে না।
         *
         * Firebase আগে saved session check করবে।
         */

        authScreen.classList.add(
            "hidden"
        );


        startAuth();

    </script>
