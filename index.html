            const [activeChatUser, setActiveChatUser] = React.useState('Tanisha Islam');
            const [currentChatMessage, setCurrentChatMessage] = React.useState('');

            // Modals
            const [showAuthModal, setShowAuthModal] = React.useState(false);
            const [authTab, setAuthTab] = React.useState('login'); // 'login' or 'signup'

            const [showCreatePostModal, setShowCreatePostModal] = React.useState(false);
            const [showCreateStoryModal, setShowCreateStoryModal] = React.useState(false);
            const [showCreateItemModal, setShowCreateItemModal] = React.useState(false);
            const [showCreatePageModal, setShowCreatePageModal] = React.useState(false);
            const [showGoLiveModal, setShowGoLiveModal] = React.useState(false);
            const [showCallModal, setShowCallModal] = React.useState(false);

            const [commentInputText, setCommentInputText] = React.useState('');

            // Modals Form States
            const [newStoryImg, setNewStoryImg] = React.useState('');

            const [privacyProfile, setPrivacyProfile] = React.useState('Public');

            const [notifComments, setNotifComments] = React.useState(true);

            // Call Details

            // Post Composer Complex Inputs

            const [postBgGradient, setPostBgGradient] = React.useState('');
            const [postFeeling, setPostFeeling] = React.useState('');
            const [postLocation, setPostLocation] = React.useState('');
            const [postPrivacy, setPostPrivacy] = React.useState('Public');
            const [selectedMedia, setSelectedMedia] = React.useState(null);
            const [pollOptions, setPollOptions] = React.useState(['', '']);
            const [showPollInputs, setShowPollInputs] = React.useState(false);

            // User Profile State
            const [userBio, setUserBio] = React.useState('Software Craftsman & Founder of SafinBook 🚀');
            const [userWork, setUserWork] = React.useState('Lead Architect at SAFIN Tech Labs');
            const [userLives, setUserLives] = React.useState('Sirajganj, Bangladesh');

            // Interactive Mini Game State (Tic-Tac-Toe vs AI inside SafinBook Gaming Hub)
            const [board, setBoard] = React.useState(Array(9).fill(null));
            const [gameWinner, setGameWinner] = React.useState(null);

            // Toast Alert
            const [toastMessage, setToastMessage] = React.useState('');

            // Refs
            const fileInputRef = React.useRef(null);

            React.useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged((currentUser) => {
                    setUser(currentUser);
                    if (!currentUser) setShowAuthModal(true);
                    else setShowAuthModal(false);
                });
                return () => unsubscribe();
            }, []);

            React.useEffect(() => {
                const postsRef = db.ref('posts');
                postsRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        const loaded = Object.keys(data).map(key => ({
                            id: key,
                            ...data[key]
                        })).reverse();
                        setPosts(loaded);
                    } else {
                        setPosts([]);
                    }
                });
                return () => postsRef.off();
            }, []);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 3000);
            };

            const handleAuth = (e) => {
                e.preventDefault();
                setAuthError('');

                    auth.signInWithEmailAndPassword(authEmail, authPassword)
                        .then(() => {
                            showToast("লগইন সফল হয়েছে!");
                            setShowAuthModal(false);
                        })
                        .catch(err => setAuthError(err.message));
                } else {
                    auth.createUserWithEmailAndPassword(authEmail, authPassword)
                        .then((res) => {

                            setShowAuthModal(false);
                        })
                        .catch(err => setAuthError(err.message));
                }
            };

                    .then(() => {

            };

            const handleCreateStory = () => {

                setNewItemTitle(''); setNewItemPrice(''); setNewItemLoc('');
                setShowCreateItemModal(false);
                showToast("পণ্য মারকেটে যোগ হয়েছে!");
            };

            const handleCreatePage = () => {
                if (!newPageName) return;
                const newPage = {
                    id: 'p_' + Date.now(),
                    name: newPageName,
                    category: newPageCategory,
                    followers: '1 Follower',
                    cover: 'https://images.unsplash.com/photo-1518770660439-4636190af475?w=600',
                    avatar: user?.photoURL || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150',
                    isLiked: true
                };

                setNewPageName('');
                setShowCreatePageModal(false);
                showToast("নতুন পেজ তৈরি হয়েছে!");
            };

            const handleCreatePost = () => {
                if (!newPostText.trim() && !selectedMedia && (!pollOptions[0] || !pollOptions[1])) return;

                const authorName = user?.displayName || user?.email?.split('@')[0] || "Md Safin";
                const authorAvatar = user?.photoURL || "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150";

                let pollData = null;
                if (showPollInputs && pollOptions[0].trim() && pollOptions[1].trim()) {
                    pollData = {
                        question: newPostText || 'Cast your vote:',
                        options: pollOptions.map(opt => ({ text: opt, votes: 0 })),
                        voters: {}
                    };
                }

                const newPost = {
                    author: authorName,
                    authorAvatar: authorAvatar,
                    feeling: postFeeling || null,
                    location: postLocation || null,
                    privacy: postPrivacy,
                    bgGradient: postBgGradient || null,
                    time: "Just now",
                    text: newPostText,
                    mediaUrl: selectedMedia ? selectedMedia.url : null,
                    mediaType: selectedMedia ? selectedMedia.type : null,
                    poll: pollData,
                    likes: 0,
                    userReactions: {},
                    commentsCount: 0,
                    comments: []
                };

                db.ref('posts').push(newPost);
                showToast(lang === 'BN' ? "পোস্ট সফলভাবে প্রকাশিত হয়েছে!" : "Post published successfully!");

                setNewPostText('');
                setSelectedMedia(null);
                setPostBgGradient('');
                setPostFeeling('');
                setPostLocation('');
                setShowPollInputs(false);
                setPollOptions(['', '']);
                setShowCreatePostModal(false);
            };

            const handleReaction = (postId, reactionType) => {
                const postRef = db.ref(`posts/${postId}`);
                postRef.once('value', (snapshot) => {
                    const postData = snapshot.val();
                    if (!postData) return;

                    const userId = user?.uid || 'guest_user';
                    let currentReactions = postData.userReactions || {};
                    let currentLikes = postData.likes || 0;

                    if (currentReactions[userId] === reactionType) {
                        delete currentReactions[userId];
                        currentLikes = Math.max(0, currentLikes - 1);
                    } else {
                        if (!currentReactions[userId]) currentLikes += 1;
                        currentReactions[userId] = reactionType;
                    }

                    postRef.update({ likes: currentLikes, userReactions: currentReactions });
                });
            };

            const handleAddComment = () => {
                if (!commentInputText.trim() || !activeCommentPost) return;

                const postRef = db.ref(`posts/${activeCommentPost.id}`);
                postRef.once('value', (snapshot) => {
                    const postData = snapshot.val();
                    if (!postData) return;

                    const existingComments = postData.comments || [];
                    const newComment = {
                        id: Date.now(),
                        author: user?.displayName || 'SAFIN',
                        avatar: user?.photoURL || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150',
                        text: commentInputText,
                        time: 'Just now'
                    };

                    const updatedComments = [...existingComments, newComment];
                    postRef.update({
                        comments: updatedComments,
                        commentsCount: updatedComments.length
                    });

                    setCommentInputText('');
                    setActiveCommentPost({
                        ...activeCommentPost,
                        comments: updatedComments
                    });
                    showToast(lang === 'BN' ? "কমেন্ট যোগ হয়েছে!" : "Comment added!");
                });
            };

            // Tic Tac Toe AI Logic for Gaming Hub
            const handleBoardClick = (idx) => {
                if (board[idx] || gameWinner) return;

                const newBoard = [...board];
                newBoard[idx] = 'X';
                
                let win = checkWinner(newBoard);
                if (win) {
                    setBoard(newBoard);
                    setGameWinner(win);
                    return;
                }

                // AI move
                const emptyIndices = newBoard.map((val, i) => val === null ? i : null).filter(val => val !== null);
                if (emptyIndices.length > 0) {
                    const aiChoice = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
                    newBoard[aiChoice] = 'O';
                    win = checkWinner(newBoard);
                    if (win) setGameWinner(win);
                }
                setBoard(newBoard);
            };

            const checkWinner = (b) => {
                const lines = [
                    [0,1,2],[3,4,5],[6,7,8],
                    [0,3,6],[1,4,7],[2,5,8],
                    [0,4,8],[2,4,6]
                ];
                for (let [a,b1,c] of lines) {
                    if (b[a] && b[a] === b[b1] && b[a] === b[c]) return b[a];
                }
                if (b.every(cell => cell !== null)) return 'Draw';
                return null;
            };

            const toggleDarkMode = () => {
                setDarkMode(!darkMode);
                document.documentElement.classList.toggle('dark');
            };

            const filteredPosts = posts.filter(p => 
                (p.text && p.text.toLowerCase().includes(searchQuery.toLowerCase())) ||
                (p.author && p.author.toLowerCase().includes(searchQuery.toLowerCase()))
            );

            return (
                <div className="min-h-screen flex flex-col bg-fbBg dark:bg-fbDarkBg text-gray-900 dark:text-gray-100 pb-16 lg:pb-0">

                                <div className="relative flex py-1 items-center">
                                    <div className="flex-grow border-t border-gray-200 dark:border-fbBorderDark"></div>
                                    <span className="flex-shrink mx-2 text-[10px] text-gray-400 font-bold">OR</span>
                                    <div className="flex-grow border-t border-gray-200 dark:border-fbBorderDark"></div>
                                </div>

                                <button 
                                    onClick={handleGuestLogin} 
                                    className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl text-xs shadow transition"
                                >
                                    🚀 Continue as Guest User
                                </button>
                            </div>
                        </div>
                    )}

                    {/* EDIT PROFILE MODAL */}
                    {showEditProfileModal && (
                        <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-3">
                            <div className="bg-white dark:bg-fbCardDark w-full max-w-md rounded-2xl shadow-2xl p-5 space-y-3 border border-gray-200 dark:border-fbBorderDark">
                                <div className="flex justify-between items-center border-b pb-2">
                                    <h3 className="font-extrabold text-sm">Edit Profile Details</h3>
                                    <button onClick={() => setShowEditProfileModal(false)}><i className="fa-solid fa-xmark"></i></button>
                                </div>
                                <div className="space-y-2 text-xs">
                                    <div>
                                        <label className="font-bold text-gray-500">Bio Statement</label>
                                        <input type="text" value={userBio} onChange={(e) => setUserBio(e.target.value)} className="w-full p-2 bg-gray-100 dark:bg-fbHoverDark rounded-lg mt-1" />
                                    </div>
                                    <div>
                                        <label className="font-bold text-gray-500">Workplace</label>
                                        <input type="text" value={userWork} onChange={(e) => setUserWork(e.target.value)} className="w-full p-2 bg-gray-100 dark:bg-fbHoverDark rounded-lg mt-1" />
                                    </div>
                                    <div>
                                        <label className="font-bold text-gray-500">Lives In</label>
                                        <input type="text" value={userLives} onChange={(e) => setUserLives(e.target.value)} className="w-full p-2 bg-gray-100 dark:bg-fbHoverDark rounded-lg mt-1" />
                                    </div>
                                </div>
                                <button onClick={handleUpdateProfile} className="w-full bg-fbBlue text-white font-bold py-2.5 rounded-xl text-xs">
                                    Save Profile Changes
                                </button>
                            </div>
                        </div>
                    )}

                    {/* CREATE STORY MODAL */}
                    {showCreateStoryModal && (
                        <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-3">
                            <div className="bg-white dark:bg-fbCardDark w-full max-w-md rounded-2xl shadow-2xl p-5 space-y-3 border border-gray-200 dark:border-fbBorderDark">
                                <div className="flex justify-between items-center border-b pb-2">
                                    <h3 className="font-extrabold text-sm">Create New Story</h3>
                                    <button onClick={() => setShowCreateStoryModal(false)}><i className="fa-solid fa-xmark"></i></button>
                                </div>
                                <div>
                                    <label className="text-xs font-bold text-gray-500">Image URL</label>
                                    <input 
                                        type="text" 
                                        placeholder="https://images.unsplash.com/..." 
                                        value={newStoryImg} 
                                        onChange={(e) => setNewStoryImg(e.target.value)} 
                                        className="w-full text-xs p-2.5 bg-gray-100 dark:bg-fbHoverDark rounded-xl mt-1"
                                    />
                                </div>
                                <button onClick={handleCreateStory} className="w-full bg-fbBlue text-white font-bold py-2.5 rounded-xl text-xs">
                                    Share to Story
                                </button>
                            </div>
                        </div>
                    )}

                    {/* CREATE MARKETPLACE ITEM MODAL */}
                    {showCreateItemModal && (
                        <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-3">
                            <div className="bg-white dark:bg-fbCardDark w-full max-w-md rounded-2xl shadow-2xl p-5 space-y-3 border border-gray-200 dark:border-fbBorderDark">
                                <div className="flex justify-between items-center border-b pb-2">
                                    <h3 className="font-extrabold text-sm">Sell an Item on Marketplace</h3>
                                    <button onClick={() => setShowCreateItemModal(false)}><i className="fa-solid fa-xmark"></i></button>
                                </div>
                                <div className="space-y-2 text-xs">
                                    <input type="text" placeholder="Item Title (e.g. iPhone 15 Pro)" value={newItemTitle} onChange={(e) => setNewItemTitle(e.target.value)} className="w-full p-2.5 bg-gray-100 dark:bg-fbHoverDark rounded-xl" />
                                    <input type="text" placeholder="Price in BDT (e.g. 50,000)" value={newItemPrice} onChange={(e) => setNewItemPrice(e.target.value)} className="w-full p-2.5 bg-gray-100 dark:bg-fbHoverDark rounded-xl" />
                                    <input type="text" placeholder="Location (e.g. Dhaka)" value={newItemLoc} onChange={(e) => setNewItemLoc(e.target.value)} className="w-full p-2.5 bg-gray-100 dark:bg-fbHoverDark rounded-xl" />
                                </div>
                                <button onClick={handleCreateMarketplaceItem} className="w-full bg-fbBlue text-white font-bold py-2.5 rounded-xl text-xs">
                                    List Item For Sale
                                </button>
                            </div>
                        </div>
                    )}

                    {/* CREATE PAGE MODAL */}
                    {showCreatePageModal && (
                        <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-3">
                            <div className="bg-white dark:bg-fbCardDark w-full max-w-md rounded-2xl shadow-2xl p-5 space-y-3 border border-gray-200 dark:border-fbBorderDark">
                                <div className="flex justify-between items-center border-b pb-2">
                                    <h3 className="font-extrabold text-sm">Create New Page</h3>
                                    <button onClick={() => setShowCreatePageModal(false)}><i className="fa-solid fa-xmark"></i></button>
                                </div>
                                <div className="space-y-2 text-xs">
                                    <input type="text" placeholder="Page Name" value={newPageName} onChange={(e) => setNewPageName(e.target.value)} className="w-full p-2.5 bg-gray-100 dark:bg-fbHoverDark rounded-xl" />
                                    <select value={newPageCategory} onChange={(e) => setNewPageCategory(e.target.value)} className="w-full p-2.5 bg-gray-100 dark:bg-fbHoverDark rounded-xl">
                                        <option value="Technology">Technology & Software</option>
                                        <option value="Education">Education & Learning</option>
                                        <option value="Entertainment">Entertainment & Media</option>
                                    </select>
                                </div>
                                <button onClick={handleCreatePage} className="w-full bg-fbBlue text-white font-bold py-2.5 rounded-xl text-xs">
                                    Create Page
                                </button>
                            </div>
                        </div>
                    )}

                    {/* CREATE POST MODAL */}
                    {showCreatePostModal && (
                        <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-3">
                            <div className="bg-white dark:bg-fbCardDark w-full max-w-lg rounded-2xl shadow-2xl p-5 space-y-4 border border-gray-200 dark:border-fbBorderDark">
                                <div className="flex justify-between items-center border-b pb-2 border-gray-200 dark:border-gray-700">
                                    <h3 className="font-extrabold text-base text-center flex-1">Create Post</h3>
                                    <button onClick={() => setShowCreatePostModal(false)}>
                                        <i className="fa-solid fa-xmark text-lg"></i>
                                    </button>
                                </div>

                                <div className={`rounded-xl p-3 ${postBgGradient || 'bg-transparent'}`}>
                                    <textarea 
                                        rows="3"
                                        value={newPostText}
                                        onChange={(e) => setNewPostText(e.target.value)}
                                        placeholder="What's on your mind?"
                                        className={`w-full bg-transparent border-none text-sm focus:outline-none resize-none ${postBgGradient ? 'text-white font-bold placeholder-white/80' : ''}`}
                                    ></textarea>
                                </div>

                                <div className="flex space-x-2">
                                    <button onClick={() => setPostBgGradient('')} className="w-7 h-7 rounded-full border border-gray-400 bg-white dark:bg-fbHoverDark"></button>
                                    <button onClick={() => setPostBgGradient('bg-gradient-post-1')} className="w-7 h-7 rounded-full bg-gradient-post-1"></button>
                                    <button onClick={() => setPostBgGradient('bg-gradient-post-2')} className="w-7 h-7 rounded-full bg-gradient-post-2"></button>
                                    <button onClick={() => setPostBgGradient('bg-gradient-post-3')} className="w-7 h-7 rounded-full bg-gradient-post-3"></button>
                                    <button onClick={() => setPostBgGradient('bg-gradient-post-4')} className="w-7 h-7 rounded-full bg-gradient-post-4"></button>
                                    <button onClick={() => setPostBgGradient('bg-gradient-post-5')} className="w-7 h-7 rounded-full bg-gradient-post-5"></button>
                                </div>

                                {showPollInputs && (
                                    <div className="space-y-2 border-t pt-2">
                                        <span className="text-xs font-bold text-amber-500">Poll Options:</span>
                                        <input type="text" placeholder="Option 1" value={pollOptions[0]} onChange={(e) => setPollOptions([e.target.value, pollOptions[1]])} className="w-full text-xs p-2 rounded-lg bg-gray-100 dark:bg-fbHoverDark" />
                                        <input type="text" placeholder="Option 2" value={pollOptions[1]} onChange={(e) => setPollOptions([pollOptions[0], e.target.value])} className="w-full text-xs p-2 rounded-lg bg-gray-100 dark:bg-fbHoverDark" />
                                    </div>
                                )}

                                <input type="file" ref={fileInputRef} accept="image/*,video/*" onChange={(e) => {
                                    const file = e.target.files[0];
                                    if (file) {
                                        const reader = new FileReader();
                                        reader.onloadend = () => setSelectedMedia({ url: reader.result, type: file.type.startsWith('video') ? 'video' : 'image' });
                                        reader.readAsDataURL(file);
                                    }
                                }} className="hidden" />

                                <button onClick={handleCreatePost} className="w-full bg-fbBlue text-white font-bold py-2.5 rounded-xl text-xs hover:bg-fbHoverBlue transition">
                                    PUBLISH POST
                                </button>
                            </div>
                        </div>
                    )}

                    {/* COMMENTS DRAWER / MODAL */}
                    {activeCommentPost && (
                        <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-end sm:items-center justify-center p-2 sm:p-4">
                            <div className="bg-white dark:bg-fbCardDark w-full max-w-lg rounded-2xl shadow-2xl p-4 space-y-3 border border-gray-200 dark:border-fbBorderDark max-h-[80vh] flex flex-col justify-between">
                                <div className="flex justify-between items-center border-b pb-2">
                                    <h3 className="font-bold text-sm">Comments ({activeCommentPost.comments ? activeCommentPost.comments.length : 0})</h3>
                                    <button onClick={() => setActiveCommentPost(null)}>
                                        <i className="fa-solid fa-xmark text-lg"></i>
                                    </button>
                                </div>

                                <div className="flex-1 overflow-y-auto space-y-2 p-1">
                                    {(!activeCommentPost.comments || activeCommentPost.comments.length === 0) ? (
                                        <p className="text-center text-xs text-gray-400 py-4">No comments yet. Be the first to comment!</p>
                                    ) : (
                                        activeCommentPost.comments.map((c) => (
                                            <div key={c.id} className="flex space-x-2">
                                                <img src={c.avatar} className="w-7 h-7 rounded-full object-cover" />
                                                <div className="bg-gray-100 dark:bg-fbHoverDark p-2 rounded-2xl text-xs flex-1">
                                                    <b className="block text-[11px] font-bold">{c.author}</b>
                                                    <p>{c.text}</p>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>

                                <div className="flex items-center space-x-2 pt-2 border-t">
                                    <input 
                                        type="text" 
                                        value={commentInputText}
                                        onChange={(e) => setCommentInputText(e.target.value)}
                                        onKeyDown={(e) => e.key === 'Enter' && handleAddComment()}
                                        placeholder="Write a comment..."
                                        className="flex-1 bg-gray-100 dark:bg-fbHoverDark text-xs px-3 py-2 rounded-full focus:outline-none"
                                    />
                                    <button onClick={handleAddComment} className="bg-fbBlue text-white px-4 py-2 rounded-full text-xs font-bold">Post</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* STORY VIEWER MODAL */}
                    {activeStoryViewer && (
                        <div className="fixed inset-0 z-50 bg-black flex flex-col justify-between p-4">
                            <div className="flex justify-between items-center text-white z-10">
                                <div className="flex items-center space-x-2">
                                    <img src={activeStoryViewer.avatar} className="w-9 h-9 rounded-full border-2 border-fbBlue object-cover" />
                                    <div>
                                        <h4 className="font-bold text-xs">{activeStoryViewer.user}</h4>
                                        <span className="text-[10px] opacity-70">{activeStoryViewer.time}</span>
                                    </div>
                                </div>
                                <button onClick={() => setActiveStoryViewer(null)} className="text-white text-2xl">
                                    <i className="fa-solid fa-xmark"></i>
                                </button>
                            </div>

                            <div className="relative flex-1 rounded-2xl overflow-hidden my-3 flex items-center justify-center">
                                <img src={activeStoryViewer.image} className="w-full h-full object-contain" />
                            </div>

                            <div className="flex space-x-2 max-w-md mx-auto w-full z-10">
                                <input type="text" placeholder={`Reply to ${activeStoryViewer.user}...`} className="flex-1 bg-white/20 text-white placeholder-white/70 text-xs px-4 py-2.5 rounded-full border border-white/30 focus:outline-none" />
                                <button onClick={() => { showToast("Story reply sent!"); setActiveStoryViewer(null); }} className="bg-fbBlue text-white font-bold text-xs px-4 py-2.5 rounded-full">Send</button>
                            </div>
                        </div>
                    )}

                    {/* LIVE STREAM MODAL */}
                    {showGoLiveModal && (
                        <div className="fixed inset-0 z-50 bg-black flex flex-col justify-between p-4">
                            <div className="flex justify-between items-center text-white z-10">
                                <div className="flex items-center space-x-2">
                                    <span className="bg-red-600 text-white text-xs font-black px-2.5 py-1 rounded-md animate-pulse">LIVE</span>
                                    <span className="text-xs font-bold bg-black/50 px-2 py-1 rounded">👁️ 3,410 Viewers</span>
                                </div>
                                <button onClick={() => setShowGoLiveModal(false)} className="text-white text-2xl">
                                    <i className="fa-solid fa-xmark"></i>
                                </button>
                            </div>

                            <div className="relative flex-1 rounded-2xl overflow-hidden bg-gray-900 my-3 flex items-center justify-center">
                                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=800" className="w-full h-full object-cover" />
                                <div className="absolute bottom-4 left-4 right-4 text-white space-y-2 max-h-36 overflow-y-auto no-scrollbar">
                                    <div className="bg-black/40 backdrop-blur-sm p-1.5 rounded-lg text-xs"><b>Tanisha Islam:</b> Love the broadcast! ❤️</div>
                                    <div className="bg-black/40 backdrop-blur-sm p-1.5 rounded-lg text-xs"><b>Abu Shovo:</b> Hello Safin! 👋</div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* CALL MODAL */}
                    {showCallModal && (
                        <div className="fixed inset-0 z-50 bg-gray-900 text-white flex flex-col items-center justify-between p-8">
                            <div className="text-center space-y-2 mt-10">
                                <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=200" className="w-28 h-28 rounded-full border-4 border-fbBlue mx-auto object-cover animate-pulse" />
                                <h3 className="text-xl font-bold">{activeChatUser}</h3>
                                <p className="text-xs text-gray-400">{callStatus}</p>
                            </div>

                            <div className="flex space-x-6 mb-10">
                                <button onClick={() => setShowCallModal(false)} className="w-14 h-14 rounded-full bg-red-600 flex items-center justify-center text-xl shadow-xl">
                                    <i className="fa-solid fa-phone-slash"></i>
                                </button>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
