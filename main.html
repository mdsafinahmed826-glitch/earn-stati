async function boot(){
  root.innerHTML='<div class="auth"><div class="card" style="text-align:center">Connecting...</div></div>';
  try{
    if(!firebase.apps.length)firebase.initializeApp(window.SAFIN_FIREBASE);
    db=firebase.firestore();FV=firebase.firestore.FieldValue;
    try{db.settings({experimentalAutoDetectLongPolling:true,merge:true})}catch(e){}
    await withTimeout(db.collection('settings').doc('main').get(),12000)
  }catch(e){console.warn(e);errorScreen(e.message||String(e));return}

  if(uid){try{var d=await db.collection('users').doc(uid).get();if(d.exists&&d.data().role==='admin')A.me=d.data()}catch(e){console.warn(e)}}
  if(A.me)start();else await showAuth()
}

}
async function doLogin(){
  var l=normL($('#a-id').value),pw=$('#a-pw').value;
  if(!l||!pw){toast('Wrong login or password');return}
  var s=await db.collection('users').where('login','==',l).limit(1).get();
  if(s.empty||s.docs[0].data().pass!==await sha(pw)){toast('Wrong login or password');return}
  var u=s.docs[0].data();if(u.role!=='admin'){toast('This account is not an admin');return}
  A.me=u;try{localStorage.setItem('sa_admin_uid',u.id)}catch(e){}start()
}

  if(l.length<3){toast('Enter a login (mobile, email or username)');return}
  if(pw.length<6){toast('Password must be at least 6 characters');return}
  if(pw!==pw2){toast('Passwords do not match');return}
  var ex=await db.collection('users').where('role','==','admin').limit(1).get();
  if(!ex.empty){toast('An admin already exists');showAuth('login');return}
  var h=await sha(pw);var s=await db.collection('users').where('login','==',l).limit(1).get();var u;
  if(!s.empty){u=s.docs[0].data();if(u.pass!==h){toast('This login already exists with a different password');return}u.role='admin';await db.collection('users').doc(u.id).set(clean(u))}

}

var byOrder=function(a,b){return(a.order||0)-(b.order||0)};
function start(){
  tab=(location.hash.slice(1)||'dash');if(!TABS.some(function(t){return t[0]===tab}))tab='dash';
  shell();
  listen('products',function(a){A.products=a.sort(function(x,y){return(y.added||0)-(x.added||0)})});
  listen('orders',function(a){A.orders=a.sort(function(x,y){return y.t-x.t})});
  listen('users',function(a){A.users=a.sort(function(x,y){return(y.joined||0)-(x.joined||0)})});
  listen('messages',function(a){A.msgs=a.sort(function(x,y){return y.t-x.t})});
  listen('coupons',function(a){A.coupons=a});
  listen('categories',function(a){A.cats=a.sort(byOrder)});
  listen('banners',function(a){A.banners=a.sort(byOrder)});
  listen('dsplans',function(a){A.plans=a.sort(function(x,y){return(x.price||0)-(y.price||0)})});
  listen('dsrequests',function(a){A.reqs=a.sort(function(x,y){return y.t-x.t})});
  listen('dsaccess',function(a){A.access=a});
  listenDoc('settings/main',function(d){A.settings=Object.assign({},S0,d||{})});
  listenDoc('settings/content',function(d){A.content=d||{}});
  listenDoc('settings/payments',function(d){A.pays=d&&d.methods?d.methods:null});
  listenDoc('settings/ui',function(d){A.ui=d||{}});
  listen('reviews',function(a){var o={};a.forEach(function(x){o[x.id]=x.list||[]});A.rv=o});
  autoSeed();
  draw()
}
function shell(){
  root.innerHTML='<div class="wrap"><div class="top"><span class="logo">🛡️ SAFIN ENTERPRISE<small>Admin</small></span><span class="sp"></span><span class="muted" id="who"></span><button class="btn line sm" data-act="logout"><i class="fas fa-sign-out-alt"></i> Logout</button></div><div class="body"><nav class="side" id="side"></nav><main class="main" id="main"></main></div></div>';
  $('#who').textContent=A.me.name
}
function side(){
  var pend=A.orders.filter(function(o){return o.status==='Pending'}).length,rq=A.reqs.filter(function(r){return r.status==='pending'}).length;
  $('#side').innerHTML=TABS.map(function(t){var b=t[0]==='orders'?pend:t[0]==='msgs'?A.msgs.length:t[0]==='ds'?rq:0;return'<a class="'+(tab===t[0]?'on':'')+'" data-act="tab" data-t="'+t[0]+'"><i class="fas '+t[2]+'"></i>'+t[1]+(b?'<span class="bg">'+b+'</span>':'')+'</a>'}).join('')
}
function draw(){if(raf)return;raf=requestAnimationFrame(function(){raf=0;if(!A.me)return;side();var m=$('#main');if(!m)return;var ae=document.activeElement;
  var typing=ae&&m.contains(ae)&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName);
  if(!typing&&!(dirty&&EDIT[tab]))m.innerHTML=VIEW[tab]();
  if(curOrder&&$('#modal .box'))$('#modal .box').innerHTML=orderBody(curOrder)})}
function redraw(){dirty=false;var m=$('#main');if(m)m.innerHTML=VIEW[tab]();side()}

/* ---------- small helpers ---------- */
var VIEW={};
function fld(l,id,v,type,cls,extra){return'<label class="f '+(cls||'')+'">'+l+'<input type="'+(type||'text')+'" id="'+id+'" value="'+esc(v==null?'':v)+'" '+(extra||'')+'></label>'}
function area(l,id,v,rows){return'<label class="f">'+l+'<textarea id="'+id+'" rows="'+(rows||3)+'">'+esc(v||'')+'</textarea></label>'}
function chk(l,id,on){return'<label class="row" style="margin-bottom:12px"><input type="checkbox" id="'+id+'" '+(on?'checked':'')+'> '+l+'</label>'}
function stat(n,l,c){return'<div class="st"><b style="color:'+c+'">'+n+'</b><span>'+l+'</span></div>'}
function g(id){var e=$('#'+id);return e?e.value.trim():''}
function num(id){return Number(g(id))||0}
function rev(o){return o.ds?(o.cost||0)+(o.ship_fee||0):o.total}
function catList(){return A.cats.length?A.cats:DEFCATS}
function uAccess(id){return A.access.find(function(a){return a.uid===id})}
function dsOn(a){return !!a&&a.active!==false&&a.expires>Date.now()}
function pays(){
  if(A.pays&&A.pays.length)return A.pays;var n=A.settings.payNumber||'';
  return[{id:'cod',name:'Cash on Delivery',type:'cod',icon:'fa-money-bill',number:'',kind:'',note:'Pay in cash when your order arrives.',active:true,needTrx:false},
  {id:'bkash',name:'bKash',type:'mfs',icon:'fa-mobile-alt',number:n,kind:'Send Money',note:'',active:true,needTrx:true},
  {id:'nagad',name:'Nagad',type:'mfs',icon:'fa-mobile-alt',number:n,kind:'Send Money',note:'',active:true,needTrx:true},
  {id:'rocket',name:'Rocket',type:'mfs',icon:'fa-mobile-alt',number:n,kind:'Send Money',note:'',active:true,needTrx:true}]
}
function zonesText(){var d=A.settings.districts;if(!d||!d.length)d=DEFDIST.map(function(n){return{n:n,fee:NEAR.indexOf(n)>=0?A.settings.nearFee:A.settings.farFee}});return d.map(function(z){return z.n+'='+z.fee}).join('\n')}
function dsCost(p){return Math.max(1,(p.price||0)-(A.settings.dsDiscount==null?60:A.settings.dsDiscount))}

/* ---------- views ---------- */
VIEW.dash=function(){
  var live=A.orders.filter(function(o){return o.status!=='Cancelled'});
  var rv=live.reduce(function(a,o){return a+rev(o)},0);
  var pend=A.orders.filter(function(o){return o.status==='Pending'}).length;
  var low=A.products.filter(function(p){return p.stock<=5});
  var rq=A.reqs.filter(function(r){return r.status==='pending'}).length;
  var rs=A.access.filter(dsOn).length;
  var now=new Date();now.setHours(0,0,0,0);var days=[];
  for(var i=6;i>=0;i--){var d0=now.getTime()-i*864e5,d1=d0+864e5;days.push({l:new Date(d0).toLocaleDateString('en-GB',{day:'numeric',month:'short'}),v:live.filter(function(o){return o.t>=d0&&o.t<d1}).reduce(function(a,o){return a+rev(o)},0)})}
  var mx=Math.max.apply(null,days.map(function(d){return d.v}).concat([1]));
  var h='<h2>Dashboard</h2><div class="stats">'+stat(A.orders.length,'Total orders','var(--brand)')+stat(pend,'Pending orders','#e65100')+stat(money(rv),'Revenue (excl. cancelled)','var(--ok)')+stat(A.products.length,'Products','#1565c0')+stat(low.length,'Low / out of stock','var(--err)')+stat(A.users.length,'Users','#7e57c2')+stat(rq,'Dropship requests','#e65100')+stat(rs,'Active resellers','#00897b')+stat(A.msgs.length,'Messages','#455a64')+'</div>';
  h+='<div class="card"><b>Revenue — last 7 days</b><div class="bars">'+days.map(function(d){return'<div title="'+money(d.v)+'"><span>'+(d.v?Math.round(d.v/1000*10)/10+'k':'')+'</span><i style="height:'+Math.round(d.v/mx*85)+'%"></i><span>'+d.l+'</span></div>'}).join('')+'</div></div>';
  h+='<h3>Recent orders</h3>'+ordersTable(A.orders.slice(0,6));
  if(low.length)h+='<h3>Low stock</h3><div class="card">'+low.map(function(p){return'<div class="row" style="padding:4px 0"><span class="sp">'+esc(p.name)+'</span><span class="tag '+(p.stock?'warn':'bad')+'">'+(p.stock?p.stock+' left':'Out of stock')+'</span></div>'}).join('')+'</div>';
  return h
};
function ordersTable(list){
  if(!list.length)return'<div class="empty">No orders</div>';
  return'<div class="tw"><table><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Payment</th></tr></thead><tbody>'+list.map(function(o){return'<tr class="cl" data-act="oview" data-id="'+esc(o.id)+'"><td><b>#'+esc(o.id)+'</b>'+(o.ds?' <span class="tag info">Dropship</span>':'')+'<div class="muted" style="font-size:11px">'+fdate(o.t)+'</div></td><td>'+esc(o.ship.name)+'<div class="muted" style="font-size:11px">'+esc(o.ship.phone)+' · '+esc(o.ship.district)+'</div></td><td>'+o.items.reduce(function(a,i){return a+i.qty},0)+'</td><td><b>'+money(o.total)+'</b></td><td>'+tag(o.status)+'</td><td>'+ptag(o.pay.status)+'</td></tr>'}).join('')+'</tbody></table></div>'
}
function filteredOrders(){
  var q=A.oq.toLowerCase().trim();
  return A.orders.filter(function(o){
    if(A.of==='DS'){if(!o.ds)return false}else if(A.of&&o.status!==A.of)return false;
    if(!q)return true;
    return(o.id+' '+o.ship.name+' '+o.ship.phone+' '+(o.pay.trx||'')).toLowerCase().indexOf(q)>=0})
}
VIEW.orders=function(){
  var cnt=function(s){return A.orders.filter(function(o){return o.status===s}).length};

function orderBody(id){
  var o=A.orders.find(function(x){return x.id===id});if(!o)return'<p>Order not found.</p>';
  var pl=PAYS.indexOf(o.pay.status)<0?PAYS.concat([o.pay.status]):PAYS;

  return'<h3><span class="sp">Order #'+esc(o.id)+'</span>'+(o.ds?'<span class="tag info">Dropship</span>':'')+tag(o.status)+'<button class="ico noprint" data-act="mclose" aria-label="Close"><i class="fas fa-times"></i></button></h3><div class="muted" style="margin:-6px 0 10px">'+fdate(o.t)+'</div>'+
  (rs?'<p class="muted" style="margin-bottom:8px">Reseller: <b>'+esc(rs.name)+'</b> · '+esc(rs.login)+'</p>':'')+

  '<div class="card sum" style="padding:0 0 8px;margin-bottom:10px"><div class="l"><span>Subtotal</span><span>'+money(o.sub)+'</span></div>'+(o.disc?'<div class="l"><span>Discount'+(o.coupon?' ('+esc(o.coupon)+')':'')+'</span><span>- '+money(o.disc)+'</span></div>':'')+'<div class="l"><span>Delivery</span><span>'+(o.ship_fee?money(o.ship_fee):'FREE')+'</span></div><div class="l tot"><span>'+(o.ds?'Customer pays (COD)':'Total')+'</span><span style="color:var(--brand)">'+money(o.total)+'</span></div>'+(o.ds?'<div class="l"><span>Our cost (reseller price)</span><span>'+money(o.cost)+'</span></div><div class="l"><span>Reseller profit</span><span style="color:var(--ok)">'+money(o.profit)+'</span></div>':'')+'</div>'+
  '<p style="margin-bottom:8px"><b>Delivery</b><br>'+esc(o.ship.name)+' · <a href="tel:'+esc(o.ship.phone)+'" style="color:var(--brand)">'+esc(o.ship.phone)+'</a><br>'+esc(o.ship.address)+', '+esc(o.ship.district)+(o.ship.note?'<br><span class="muted">Note: '+esc(o.ship.note)+'</span>':'')+'</p>'+
  '<p style="margin-bottom:10px"><b>Payment</b><br>'+esc(o.pay.method)+' '+ptag(o.pay.status)+(o.pay.trx?'<br><span class="muted">TrxID: '+esc(o.pay.trx)+' · From: '+esc(o.pay.sender)+'</span>':'')+'</p>'+
  '<div class="row noprint" style="flex-wrap:wrap"><label class="f sp" style="margin:0">Order status<select data-chg="ostatus" data-id="'+esc(o.id)+'">'+STAT.concat(['Cancelled']).map(function(s){return'<option value="'+s+'" '+(o.status===s?'selected':'')+'>'+esc(SLBL[s]||s)+'</option>'}).join('')+'</select></label><label class="f sp" style="margin:0">Payment status<select data-chg="opay" data-id="'+esc(o.id)+'">'+pl.map(function(s){return'<option '+(o.pay.status===s?'selected':'')+'>'+esc(s)+'</option>'}).join('')+'</select></label></div>'+

  '<div class="row noprint" style="margin-top:14px"><button class="btn line sm" data-act="oedit" data-id="'+esc(o.id)+'"><i class="fas fa-edit"></i> Edit details</button><button class="btn line sm" data-act="print"><i class="fas fa-print"></i> Print invoice</button></div>'

async function autoSeed(){
  await new Promise(function(r){setTimeout(r,3500)});
  if(!A.me||A.settings.seeded)return;
  var ck=async function(c){return(await db.collection(c).limit(1).get()).empty};
  var b=db.batch(),n=0;
  if(await ck('categories')){DEFCATS.forEach(function(c){b.set(db.collection('categories').doc(c.id),clean(c))});n++}
  if(await ck('banners')){DEFBAN.forEach(function(x,i){var o={id:'b'+(Date.now()+i),c1:x[0],c2:x[1],title:x[2],sub:x[3],emoji:x[4],link:x[5],btn:'Shop Now',img:'',order:i+1,active:true};b.set(db.collection('banners').doc(o.id),o)});n++}
  if(await ck('coupons')){DEFC.forEach(function(c){b.set(db.collection('coupons').doc(c.code),clean(c))});n++}
  if(!(await db.collection('settings').doc('payments').get()).exists){b.set(db.collection('settings').doc('payments'),{methods:clean(pays())});n++}
  if(!(await db.collection('settings').doc('content').get()).exists){b.set(db.collection('settings').doc('content'),{faqs:DEFFAQ,returnDays:7});n++}
  b.set(db.collection('settings').doc('main'),{seeded:true},{merge:true});
  await b.commit();if(n)toast('Default categories, banners, coupons & payments saved — everything is now editable')
}

/* ---------- data ops ---------- */
async function setStatus(id,s){
  var o=A.orders.find(function(x){return x.id===id});if(!o||o.status===s)return;
  var b=db.batch();var ref=db.collection('orders').doc(id);
  var pr=function(it){return A.products.find(function(p){return p.id===it.id})};
  if(s==='Cancelled'){o.items.forEach(function(it){var p=pr(it);if(p)b.update(db.collection('products').doc(p.id),{stock:FV.increment(it.qty)})})}
  else if(o.status==='Cancelled'){
    for(var i=0;i<o.items.length;i++){var p=pr(o.items[i]);if(p&&p.stock<o.items[i].qty){toast(p.name+': only '+p.stock+' left in stock');draw();return}}
    o.items.forEach(function(it){var p=pr(it);if(p)b.update(db.collection('products').doc(p.id),{stock:FV.increment(-it.qty)})})}
  var up={status:s,hist:FV.arrayUnion({s:s,t:Date.now()})};
  if(s==='Delivered'&&o.pay.status==='Unpaid (COD)')up['pay.status']='Paid';
  b.update(ref,up);await b.commit();toast('Order status updated')
}
async function grant(u,planId,planName,days){
  var cur=uAccess(u.id),base=dsOn(cur)?cur.expires:Date.now(),exp=base+days*864e5;
  await db.collection('dsaccess').doc(u.id).set({uid:u.id,name:u.name,phone:u.phone||u.login||'',planId:planId||'',planName:planName||'',expires:exp,active:true,since:(cur&&cur.since)||Date.now(),updated:Date.now()});
  return exp
}

  dsextend:function(t){var a=uAccess(t.dataset.id);if(!a)return;return run(async function(){var base=dsOn(a)?a.expires:Date.now();await db.collection('dsaccess').doc(a.uid).update({expires:base+30*864e5,active:true,updated:Date.now()});toast('Extended by 30 days')})},
  dsgrant:function(){
    modal('<h3>Grant dropshipping access</h3><label class="f">User<select id="gr-user">'+A.users.filter(function(u){return u.role!=='admin'}).map(function(u){return'<option value="'+esc(u.id)+'">'+esc(u.name)+' — '+esc(u.login)+'</option>'}).join('')+'</select></label><label class="f">Plan<select id="gr-plan">'+A.plans.map(function(p){return'<option value="'+esc(p.id)+'">'+esc(p.name)+' ('+p.days+' days)</option>'}).join('')+'<option value="">Custom days</option></select></label>'+fld('Days (for custom)','gr-days',30,'number')+'<div class="row"><button class="btn line sp" data-act="mclose">Cancel</button><button class="btn sp" data-act="grsave">Grant</button></div>')},
  grsave:function(){return run(async function(){
    var u=A.users.find(function(x){return x.id===$('#gr-user').value});if(!u){toast('Select a user');return}
    var p=A.plans.find(function(x){return x.id===$('#gr-plan').value});var days=p?p.days:Math.floor(num('gr-days'));
    if(!(days>0)){toast('Enter days');return}await grant(u,p?p.id:'',p?p.name:'Manual',days);mclose();toast('Access granted')})},

  /* help & terms */
  faqadd:function(){$('#faqbox').insertAdjacentHTML('beforeend',faqRow({q:'',a:''}));dirty=true},
  faqdel:function(t){t.closest('.faq').remove();dirty=true},
  ctsave:function(){return run(async function(){
    var faqs=[];document.querySelectorAll('#faqbox .faq').forEach(function(r){var q=r.querySelector('.fq').value.trim(),a=r.querySelector('.fa').value.trim();if(q&&a)faqs.push({q:q,a:a})});
    var o={faqs:faqs,helpIntro:g('ct-intro'),terms:g('ct-terms'),returnPolicy:g('ct-return'),checkoutNote:g('ct-checkout'),aboutText:g('ct-about'),returnDays:Math.max(0,num('ct-rdays')),footerText:g('ct-foot')};
    await db.collection('settings').doc('content').set(clean(o));dirty=false;toast('Help & terms saved')})},

  /* users, messages, settings */
  urole:function(t){var u=A.users.find(function(x){return x.id===t.dataset.id});if(!u||u.id===A.me.id)return;if(!confirm((u.role==='admin'?'Remove admin access from ':'Give admin access to ')+u.name+'?'))return;return run(async function(){await db.collection('users').doc(u.id).update({role:u.role==='admin'?'user':'admin'});toast('Role updated')})},
  mdel:function(t){if(!confirm('Delete this message?'))return;return run(async function(){await db.collection('messages').doc(t.dataset.id).delete();toast('Message deleted')})},
  ssave:function(){return run(async function(){
    var s={brandName:g('st-name')||'SAFIN ENTERPRISE',brandEmoji:g('st-emoji')||'🛍️',brandColor:$('#st-color').value,announce:g('st-ann'),phone:g('st-phone'),whatsapp:g('st-wa'),email:g('st-mail'),address:g('st-addr'),
      flashTitle:g('st-ftitle')||'Flash Sale',flashHours:Math.max(1,num('st-fh')||8),offerMin:Math.max(1,num('st-offer')||30),showOffers:$('#st-showoff').checked,
      dsEnabled:$('#st-dson').checked,dsDiscount:Math.max(0,num('st-dsdisc')),dsNote:g('st-dsnote')};
    await db.collection('settings').doc('main').set(s,{merge:true});dirty=false;toast('Store settings saved')})},
  pwsave:function(){return run(async function(){
    var cur=$('#pw-cur').value,nw=$('#pw-new').value;
    if(nw.length<6){toast('Password must be at least 6 characters');return}
    if(await sha(cur)!==A.me.pass){toast('Current password is wrong');return}
    var h=await sha(nw);await db.collection('users').doc(A.me.id).update({pass:h});A.me.pass=h;$('#pw-cur').value='';$('#pw-new').value='';toast('Password changed')})}
};
ACT.txsave=function(){return run(async function(){
  var t={},sec={};TXK.forEach(function(x){var v=g('tx-'+x[0]);if(v)t[x[0]]=v});
  SECK.forEach(function(x){sec[x[0]]=$('#sc-'+x[0]).checked});
  await db.collection('settings').doc('ui').set({t:t,sec:sec});dirty=false;toast('Texts & layout saved')})};
ACT.rvman=function(t){rvModal(t.dataset.id)};
ACT.rvadd=function(t){return run(async function(){
  var id=t.dataset.id,p=A.products.find(function(x){return x.id===id});if(!p)return;
  var name=g('rv-name'),text=g('rv-text'),st=Number($('#rv-st').value);
  if(!name||!text){toast('Enter name and review text');return}
  var l=[{uid:'admin',name:name,rating:st,text:text,t:Date.now(),verified:false}].concat(A.rv[id]||[]);
  var rc=p.rc||0,ra=p.rating||0;var b=db.batch();
  b.set(db.collection('reviews').doc(id),{id:id,list:l});
  b.update(db.collection('products').doc(id),{rating:Math.round((ra*rc+st)/(rc+1)*10)/10,rc:rc+1});
  await b.commit();A.rv[id]=l;p.rc=rc+1;toast('Review added');rvModal(id)})};
ACT.rvdel=function(t){return run(async function(){
  var id=t.dataset.id,i=Number(t.dataset.i),p=A.products.find(function(x){return x.id===id});if(!p)return;
  var l=(A.rv[id]||[]).slice(),x=l.splice(i,1)[0];if(!x||!confirm('Delete this review?'))return;
  var rc=p.rc||0,ra=p.rating||0,n=Math.max(0,rc-1);var nr=n?Math.min(5,Math.max(0,Math.round((ra*rc-x.rating)/n*10)/10)):0;
  var b=db.batch();b.set(db.collection('reviews').doc(id),{id:id,list:l});b.update(db.collection('products').doc(id),{rating:nr,rc:n});
  await b.commit();A.rv[id]=l;p.rc=n;p.rating=nr;toast('Review deleted');rvModal(id)})};
ACT.oedit=function(t){var o=A.orders.find(function(x){return x.id===t.dataset.id});if(!o)return;
  modal('<h3>Edit order #'+esc(o.id)+'</h3>'+fld('Customer name','oe-name',o.ship.name)+fld('Mobile','oe-phone',o.ship.phone)+fld('District','oe-dist',o.ship.district)+area('Address','oe-addr',o.ship.address,2)+fld('Note','oe-note',o.ship.note||'')+'<div class="row">'+fld('Delivery fee (৳)','oe-fee',o.ship_fee||0,'number','sp')+(o.ds?'':fld('Discount (৳)','oe-disc',o.disc||0,'number','sp'))+'</div><p class="muted" style="font-size:12px;margin-bottom:10px">Total is recalculated: items '+money(o.sub)+' − discount + delivery.</p><div class="row"><button class="btn line sp" data-act="mclose">Cancel</button><button class="btn sp" data-act="osave" data-id="'+esc(o.id)+'">Save</button></div>')};
ACT.osave=function(t){return run(async function(){
  var o=A.orders.find(function(x){return x.id===t.dataset.id});if(!o)return;
  var fee=Math.max(0,num('oe-fee')),disc=o.ds?0:Math.max(0,num('oe-disc'));
  await db.collection('orders').doc(o.id).update({'ship.name':g('oe-name'),'ship.phone':g('oe-phone'),'ship.district':g('oe-dist'),'ship.address':g('oe-addr'),'ship.note':g('oe-note'),ship_fee:fee,disc:disc,total:Math.max(0,o.sub-disc+fee)});
  curOrder=o.id;$('#modal').innerHTML='<div class="ov" data-act="mov"><div class="box">'+orderBody(o.id)+'</div></div>';toast('Order updated')})};
ACT.uedit=function(t){var u=A.users.find(function(x){return x.id===t.dataset.id});if(!u)return;
  modal('<h3>Edit user</h3>'+fld('Name','ue-name',u.name)+fld('Login (mobile / email)','ue-login',u.login)+fld('Phone','ue-phone',u.phone||'')+fld('District','ue-dist',u.district||'')+area('Address','ue-addr',u.address||'',2)+fld('New password (leave empty to keep)','ue-pw','','password')+'<div class="row"><button class="btn line sp" data-act="mclose">Cancel</button><button class="btn sp" data-act="usave" data-id="'+esc(u.id)+'">Save</button></div>')};
ACT.usave=function(t){return run(async function(){
  var u=A.users.find(function(x){return x.id===t.dataset.id});if(!u)return;
  var l=normL(g('ue-login'));if(l.length<3){toast('Enter a valid login');return}
  var o={name:g('ue-name'),login:l,phone:g('ue-phone'),district:g('ue-dist'),address:g('ue-addr')};
  var pw=$('#ue-pw').value;if(pw){if(pw.length<6){toast('Password must be at least 6 characters');return}o.pass=await sha(pw)}
  await db.collection('users').doc(u.id).update(o);mclose();toast('User updated')})};
var CHG={
  ostatus:function(t){return run(function(){return setStatus(t.dataset.id,t.value)})},
  opay:function(t){return run(async function(){await db.collection('orders').doc(t.dataset.id).update({'pay.status':t.value});toast('Payment status updated')})},
  pstock:function(t){var v=Math.max(0,Math.floor(Number(t.value)||0));return run(async function(){await db.collection('products').doc(t.dataset.id).update({stock:v});toast('Stock updated')})}
};
var INP={
  osearch:function(t){A.oq=t.value;$('#olist').innerHTML=ordersTable(filteredOrders())},
  psearch:function(t){A.pq=t.value;$('#plist').innerHTML=productsTable()}
};

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;var f=ACT[t.dataset.act];if(!f)return;
  if(t.dataset.act!=='mov')e.stopPropagation();
  if(t.classList.contains('btn')&&!t.hasAttribute('data-nb')){if(t.classList.contains('busy'))return;t.classList.add('busy');Promise.resolve(f(t,e)).finally(function(){t.classList.remove('busy')})}
  else f(t,e)
});
document.addEventListener('change',function(e){var t=e.target;if(t.dataset&&t.dataset.chg&&CHG[t.dataset.chg]){if(t.tagName==='SELECT')t.blur();CHG[t.dataset.chg](t)}});
document.addEventListener('input',function(e){var t=e.target;
  if(t.dataset&&t.dataset.inp&&INP[t.dataset.inp])INP[t.dataset.inp](t);
  else if(t.closest&&t.closest('#main')&&!(t.dataset&&t.dataset.chg))dirty=true});
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;var c=e.target.closest&&e.target.closest('[data-enter]');
  if(c&&e.target.tagName!=='TEXTAREA'){var b=c.querySelector('[data-act="'+c.dataset.enter+'"]');if(b){e.preventDefault();b.click()}}
});
window.addEventListener('hashchange',function(){var t=location.hash.slice(1);if(A.me&&TABS.some(function(x){return x[0]===t})&&t!==tab){tab=t;dirty=false;draw()}});
boot()
})();

</script>
</body>
</html>
